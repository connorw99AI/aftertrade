[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metals-lab"
version = "0.1.0"
description = "MT5 demo-only gold/silver strategy laboratory with per-bot virtual ledgers"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14",
  "pyyaml>=6",
]

[project.optional-dependencies]
# The official MetaTrader5 package only ships Windows wheels.
windows = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]
dev = ["pytest>=8", "httpx>=0.26"]

[project.scripts]
metals-lab = "metals_lab.cli:main"

[tool.setuptools.packages.find]
include = ["metals_lab*"]

[tool.setuptools.package-data]
metals_lab = ["store/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
