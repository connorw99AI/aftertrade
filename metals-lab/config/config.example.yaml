# Metals Creature Lab - example configuration.
# Copy to config/config.yaml. Contains NO credentials: the system attaches to the MT5
# terminal you have already logged into. Credential-like keys are rejected on load.

mt5:
  terminal_path: null            # e.g. "C:/Program Files/MetaTrader 5/terminal64.exe"; null = attach to running terminal
  timeout_ms: 60000
  server_timezone: auto          # or an IANA zone matching your broker's server clock, e.g. "Europe/Athens"
  sessions_export: null          # e.g. "C:/Users/<you>/AppData/Roaming/MetaQuotes/Terminal/Common/Files/metals_lab_sessions.json"

instruments:
  gold: null                     # exact terminal symbol (e.g. "XAUUSD"); required if discovery finds several candidates
  silver: null
  reference_symbols: []          # optional read-only auditor inputs, e.g. ["EURUSD"]; never traded

# Optional explicit sessions in SERVER time if you do not use the MQL5 export.
# sessions:
#   gold:   {windows: [{days: [0,1,2,3,4], start: "01:00", end: "24:00"}], closures: ["2026-12-25"]}
#   silver: {windows: [{days: [0,1,2,3,4], start: "01:00", end: "24:00"}], closures: ["2026-12-25"]}

capital:
  bot_fraction: 0.045454         # 22 bots (11 strategies x long and short halves), 1/22 each of the starting balance

# Which metals each bot trades and when is a per-bot setting (bot page > Settings), in UK time:
#   trade_gold: on, trade_silver: on, gold_windows: "00:00-24:00", silver_windows: "06:00-11:00, 13:00-17:00"
# Every bot starts with both metals on and 00:00-24:00 (whenever the market is open).

risk:
  risk_per_trade: 0.03             # sizing target: trade more than min_lot only when 3% of the bot allows it
  min_lot: {GOLD: 0.05, SILVER: 0.03}  # size for wider stops (floor), per metal; 0 = risk-sized only
  big_lot: {GOLD: 0.1, SILVER: 0.06}   # size for tighter stops...
  big_lot_max_risk: 0.30           # ...used when its loss at the strategy's stop is at most 30% of the bot
  per_trade_limit_enabled: false   # true = reject trades whose stop loss exceeds risk_per_trade
  pre_trade_limits: false          # true re-enables per-trade risk, margin-share and exposure caps; false = rely on stops/pauses
  max_entries_per_bot_per_day: 5   # new trades per bot per UTC day (a two-leg group counts once); 0 = no cap
  max_trade_risk: 0                # >0 skips a trade if even min_lot would risk more than that share of the bot (0 = off)
  daily_loss_pause: 0.30           # bot stops new entries for the rest of the UTC day after losing 30% on the day
  daily_lock_from: 0.05            # profit lock: once the bot is up 5%+ on the day...
  daily_giveback: 0.5              # ...it stops for the day after giving back half of the day's best gain (0 = off)
  daily_profit_stop: 0             # stop after gaining this much on the day (0 = off); open trades keep being managed
  max_drawdown_pause: 0.50         # bot paused (you restart it) after a 50% fall from its best balance; open trades still managed
  weekend_flat_from: "20:00"       # Friday UTC: close every position, no entries until Sunday 22:00 UTC
  max_positions_per_bot: 2
  max_bot_margin_fraction: 0.5
  min_account_margin_level: 300
  max_account_margin_used: 0.5
  exposure_scope: per_bot          # exposure caps judge each bot as if it had its own account
  max_metals_gross_exposure: 200.0 # position value / bot equity (0.1 lot of gold is roughly 250x a 150 bot)
  max_same_direction_exposure: 200.0
  max_spread_points: {GOLD: 80, SILVER: 80}
  commission_per_lot_side_estimate: 0.0   # set to your demo's commission for planning; actual commission comes from deals

selection:
  min_trades: 50                   # ranking: closed trades before a bot can be a live candidate

news:
  enabled: false                   # no news checks at all
  provider: csv
  path: config/news_calendar.csv
  max_age_hours: 192
  pre_minutes: 30
  post_minutes: 30
  impacts: [HIGH]
  unknown_policy: manual_review   # manual_review | delay | allow_with_flag
  filter_enabled: true

execution:
  deviation_points: 30
  approval_ttl_seconds: 20
  loop_interval_seconds: 10
  intent_timeout_seconds: 120
  settle_seconds: 300

api:
  host: 127.0.0.1
  port: 8765
  token_env: METALS_LAB_API_TOKEN

storage:
  db_path: data/state.sqlite
  cache_dir: data/cache

strategies:
  S01: {params: {}}
  S02: {params: {}}
  S03: {params: {}}
  S04: {params: {}}
  S05: {params: {}}
  S06: {params: {}}
  S07: {params: {}}
  S08: {params: {}}
  S09: {params: {}}
  S10: {params: {}}
