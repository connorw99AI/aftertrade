// ============ window.storage polyfill (localStorage-backed) ============
// The original app targets Claude's artifact persistence API (window.storage),
// which only exists inside claude.ai's artifact iframe. Since this is a
// standalone HTML file, we provide an equivalent API backed by localStorage
// so settings/rules/setups persist across reloads in this browser.
(function () {
  function ns(key) { return "aftertrade:" + key; }
  window.storage = {
    async get(key) {
      try {
        const v = localStorage.getItem(ns(key));
        return v !== null ? { key, value: v, shared: false } : null;
      } catch (e) { return null; }
    },
    async set(key, value) {
      try {
        localStorage.setItem(ns(key), value);
        return { key, value, shared: false };
      } catch (e) { return null; }
    },
    async delete(key) {
      try {
        localStorage.removeItem(ns(key));
        return { key, deleted: true, shared: false };
      } catch (e) { return null; }
    },
    async list(prefix) {
      try {
        const p = ns(prefix || "");
        const keys = Object.keys(localStorage)
          .filter(k => k.startsWith("aftertrade:") && k.startsWith(p))
          .map(k => k.slice("aftertrade:".length));
        return { keys, prefix, shared: false };
      } catch (e) { return null; }
    },
  };
})();

  return function Icon({ size = 16, color = "currentColor", strokeWidth = 2, style, className }) {
    return (
      <svg
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke={color}
        strokeWidth={strokeWidth}
        strokeLinecap="round"
        strokeLinejoin="round"
        style={style}
        className={className}
      >
        {paths.map((p, i) => {
          if (p.tag === "path") return <path key={i} d={p.d} />;
          if (p.tag === "circle") return <circle key={i} cx={p.cx} cy={p.cy} r={p.r} />;
          if (p.tag === "line") return <line key={i} x1={p.x1} y1={p.y1} x2={p.x2} y2={p.y2} />;
          if (p.tag === "polyline") return <polyline key={i} points={p.points} />;
          if (p.tag === "rect") return <rect key={i} x={p.x} y={p.y} width={p.width} height={p.height} rx={p.rx} />;
          return null;
        })}
      </svg>
    );
  };
}

function daysAgo(n, h = 10, m = 0) {
  const d = new Date();

// deterministic seeded RNG so mock data is stable across renders/reloads
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const MOCK_PAIRS = ["EUR/USD", "GBP/USD", "USD/JPY", "XAU/USD", "GBP/JPY", "USD/CAD", "AUD/USD"];
const MOCK_SETUPS = ["50 EMA pullback", "Breakout retest", "Range fade"];
const MOCK_SESSIONS = ["London", "NY", "Asia"];

function generateClosedTrades() {
  const rng = mulberry32(1337);
  const trades = [];
  let id = 1;
  // a full year back, weekdays only — enough history for monthly/quarterly/annual summaries to mean something
  for (let dayOffset = 364; dayOffset >= 0; dayOffset--) {
    const day = new Date();
    day.setDate(day.getDate() - dayOffset);
    const dow = day.getDay();
    if (dow === 0 || dow === 6) continue; // skip weekends — real trading calendars have gaps
    const roll = rng();
    const numTrades = roll < 0.35 ? 0 : roll < 0.65 ? 1 : roll < 0.85 ? 2 : 3; // triples the original volume across a full year
    for (let i = 0; i < numTrades; i++) {
      const pair = MOCK_PAIRS[Math.floor(rng() * MOCK_PAIRS.length)];
      const side = rng() > 0.5 ? "BUY" : "SELL";
      const setup = MOCK_SETUPS[Math.floor(rng() * MOCK_SETUPS.length)];
      const session = MOCK_SESSIONS[Math.floor(rng() * MOCK_SESSIONS.length)];
      const isWin = rng() > 0.44; // slight positive edge
      const vol = Math.round((0.3 + rng() * 1.8) * 10) / 10;
      const rMultiple = isWin ? +(0.4 + rng() * 2.6).toFixed(2) : -(+(0.3 + rng() * 1.8).toFixed(2));
      const pl = Math.round(rMultiple * (75 + rng() * 65) * 100) / 100;
      const plPct = +(rMultiple * 0.85).toFixed(2);
      const heldMin = Math.floor(4 + rng() * 220);
      const rrPlanned = +(0.8 + rng() * 2).toFixed(1); // sometimes below the 1.5 min-RR rule threshold
      const newsWithin15 = rng() < 0.13; // occasionally trips the news-window rule
      const minsSincePriorLoss = rng() < 0.12 ? Math.floor(rng() * 10) : 999; // occasionally trips the revenge-entry rule
      const sizeDeltaFromAvg = rng() < 0.15 ? +((0.5 + rng() * 0.8) * (rng() > 0.5 ? 1 : -1)).toFixed(1) : 0;
      const hour = 7 + Math.floor(rng() * 10);
      const minute = Math.floor(rng() * 60);
      const opened = new Date(day);
      opened.setHours(hour, minute, 0, 0);
      trades.push({
        id: `t${id++}`, pair, side, vol, opened, heldMin, pl, plPct, rMultiple,
        newsWithin15, rrPlanned, session, minsSincePriorLoss, sizeDeltaFromAvg, setup,
      });
    }
  }
  return trades;
}

const RULE_TYPES = {
  minRR: { label: "Minimum planned R:R", unit: "ratio", default: 1.5, placeholder: "1.5" },
  noNewsWindow: { label: "No trades within X minutes of major news", unit: "minutes", default: 15, placeholder: "15" },

};

// Keyword weights used to score a free-text rule against every enforceable rule type.
// The highest-scoring type wins — there is always a winner, so every rule maps to
// something Aftertrade can actually check against trades, never just "logged for reference."
const RULE_KEYWORDS = {
  noRevenge: ["loss", "losing", "lose", "revenge", "re-enter", "reenter", "re-entry", "reentry", "after a loss"],
  minRR: ["r:r", "rr", "risk reward", "risk:reward", "reward ratio", "risk to reward"],
  maxTradesPerDay: ["trades a day", "trades per day", "per day", "daily trades", "trades today"],
  dailyLossLimit: ["daily loss", "lose per day", "day", "drawdown", "per day"],
  maxWeeklyLoss: ["weekly loss", "per week", "a week", "week"],
  noNewsWindow: ["news", "announcement", "cpi", "nfp", "fomc"],
  maxLotSize: ["lot size", "lots", "position size", "max size", "size", "average size", "vs average"],
  maxRiskPct: ["risk", "% of account", "percent", "% per trade", "account risk"],
  minHoldTime: ["hold", "too fast", "too quick", "scalp", "minimum time", "at least"],
  maxHoldTime: ["hold", "too long", "overstay", "maximum time", "no more than"],
  maxConsecutiveLosses: ["consecutive loss", "in a row", "losing streak", "back to back"],
};

function extractNumber(t) {
  const pct = t.match(/(\d+(\.\d+)?)\s*%/);
  if (pct) return parseFloat(pct[1]);
  const dollar = t.match(/\$\s*(\d+(\.\d+)?)/);
  if (dollar) return parseFloat(dollar[1]);
  const any = t.match(/(\d+(\.\d+)?)/);
  return any ? parseFloat(any[1]) : null;
}

function summarizeRule(type, value) {
  switch (type) {
    case "noRevenge": return `No re-entering a trade within ${value} minutes of a loss.`;
    case "minRR": return `Only take trades with a planned risk:reward of at least ${value}.`;
    case "maxTradesPerDay": return `No more than ${value} trades per day.`;
    case "dailyLossLimit": return `Stop trading for the day after a cumulative loss of $${value}.`;
    case "maxWeeklyLoss": return `Stop trading for the week after a cumulative loss of $${value}.`;
    case "noNewsWindow": return `No trades within ${value} minutes of major news.`;
    case "maxLotSize": return `No single trade larger than ${value} lots.`;
    case "maxRiskPct": return `No trade risking more than ${value}% of the account.`;
    case "minHoldTime": return `No closing a trade in under ${value} minutes.`;
    case "maxHoldTime": return `No holding a trade longer than ${value} minutes.`;
    case "maxConsecutiveLosses": return `Stop trading after ${value} consecutive losses.`;
    default: return `${type}: ${value}`;
  }
}

// Mock "AI" interpretation of a free-text rule. Scores the sentence against every
// enforceable rule type and always resolves to the best match — Aftertrade uses this
// mapping to actually flag rule breaks, not just log the rule for reference.
function interpretRuleText(text) {
  const t = text.toLowerCase();

  // hold-time direction disambiguation: "less than / under / at least" -> minimum;
  // "more than / longer than / over" -> maximum
  const wantsMin = /(less than|under|shorter than|at least|minimum|too (fast|quick)|scalp)/.test(t);
  const wantsMax = /(more than|longer than|over|maximum|too long|overstay)/.test(t);

  const scores = {};
  Object.keys(RULE_KEYWORDS).forEach(type => {
    scores[type] = RULE_KEYWORDS[type].reduce((s, kw) => s + (t.includes(kw) ? 1 : 0), 0);
  });
  // resolve hold-time ambiguity (both minHoldTime/maxHoldTime share the "hold" keyword)
  if (/\bhold\b/.test(t)) {
    if (wantsMin) { scores.minHoldTime += 2; scores.maxHoldTime = 0; }
    else if (wantsMax) { scores.maxHoldTime += 2; scores.minHoldTime = 0; }
  }
  // "size" compared to average still resolves to maxLotSize now that the two rule types are merged
  if (/average/.test(t)) { scores.maxLotSize += 2; }

  let bestType = "dailyLossLimit", bestScore = -1;
  Object.entries(scores).forEach(([type, score]) => {
    if (score > bestScore) { bestScore = score; bestType = type; }
  });

  const n = extractNumber(t);
  const value = n !== null ? n : RULE_TYPES[bestType].default;

  return { type: bestType, value, summary: summarizeRule(bestType, value), matched: true };
}

// ruleLabel shows the rule's label with its configured value substituted in where relevant
function ruleLabel(rule) {
  if (!RULE_TYPES[rule.type]) return rule.type;
  if (RULE_TYPES[rule.type].unit === "toggle") return RULE_TYPES[rule.type].label;
  return summarizeRule(rule.type, rule.value);
}

function evaluateTrade(trade, rules, tradesThatDay, dayTotalLossAfter, weekTotalLossAfter, consecLossesBefore) {
  const violations = [];
  const violatedRuleIds = [];
  rules.filter(r => r.active).forEach(r => {
    let msg = null;
    if (r.type === "minRR" && trade.rrPlanned < r.value) msg = `Planned R:R ${trade.rrPlanned.toFixed(1)} below your ${r.value} minimum`;
    if (r.type === "noNewsWindow" && trade.newsWithin15) msg = `Opened within your ${r.value}-minute major-news window`;
    if (r.type === "maxTradesPerDay" && tradesThatDay > r.value) msg = `${tradesThatDay} trades that day, over your ${r.value} max`;
    if (r.type === "noRevenge" && trade.minsSincePriorLoss <= r.value) msg = `Re-entered ${trade.minsSincePriorLoss}min after a loss, inside your ${r.value}min window`;
    if (r.type === "maxLotSize" && trade.vol > r.value) msg = `${trade.vol} lots, over your ${r.value} lot max`;
    if (r.type === "dailyLossLimit" && dayTotalLossAfter !== undefined && dayTotalLossAfter <= -Math.abs(r.value)) msg = `Day's cumulative loss passed your ${fmtUSD(-Math.abs(r.value))} daily limit`;
    if (r.type === "maxWeeklyLoss" && weekTotalLossAfter !== undefined && weekTotalLossAfter <= -Math.abs(r.value)) msg = `Week's cumulative loss passed your ${fmtUSD(-Math.abs(r.value))} weekly limit`;
    if (r.type === "maxRiskPct" && trade.riskPct !== undefined && trade.riskPct > r.value) msg = `Risked ${trade.riskPct}% of account, over your ${r.value}% max`;
    if (r.type === "minHoldTime" && trade.heldMin < r.value) msg = `Closed after ${trade.heldMin}min, under your ${r.value}min minimum`;
    if (r.type === "maxHoldTime" && trade.heldMin > r.value) msg = `Held for ${trade.heldMin}min, over your ${r.value}min max`;
    if (r.type === "maxConsecutiveLosses" && consecLossesBefore !== undefined && consecLossesBefore >= r.value) msg = `Traded again after ${consecLossesBefore} consecutive losses, at or past your ${r.value} limit`;
    if (msg) { violations.push(msg); violatedRuleIds.push(r.id); }
  });
  return { violations, violatedRuleIds };
}
function fmt(n, d = 2) { const s = n.toFixed(d); return n >= 0 ? `+${s}` : s; }

function useCountUp(target, duration = 900) {
  const [val, setVal] = useState(0);
  const ref = React.useRef(target);
  useEffect(() => {
    const from = ref.current;
    const start = performance.now();
    let raf;
    const tick = (now) => {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(from + (target - from) * eased);
      if (p < 1) raf = requestAnimationFrame(tick);
      else ref.current = target;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [target]);
  return val;
}

let CURRENCY_SYMBOL = "$";
function setGlobalCurrency(sym) { CURRENCY_SYMBOL = sym; }
function fmtUSD(n) { return `${n >= 0 ? "+" : "−"}${CURRENCY_SYMBOL}${Math.abs(n).toFixed(2)}`; }
function fmtMoney(n) { return `${CURRENCY_SYMBOL}${n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`; }
function dateKey(d) { return d.toISOString().slice(0, 10); }
function dateLabel(d) { return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); }
function weekKey(d) { const t = new Date(d); const day = (t.getDay() + 6) % 7; t.setDate(t.getDate() - day); return dateKey(t); }
function monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
function quarterKey(d) { return `${d.getFullYear()}-Q${Math.floor(d.getMonth() / 3) + 1}`; }
function yearKey(d) { return `${d.getFullYear()}`; }
function periodLabel(period, group) {
  if (period === "daily") return dateLabel(group.date);
  if (period === "weekly") return `Week of ${dateLabel(group.start)}`;
  if (period === "monthly") return group.start.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  if (period === "quarterly") return `Q${Math.floor(group.start.getMonth() / 3) + 1} ${group.start.getFullYear()}`;
  if (period === "annual") return `${group.start.getFullYear()}`;
  return "";
}

// aggregate stats for a group of trades — the basis for both brief and extended narratives
// Edge Score for any subset of trades — same formula used globally, scoped here to a setup or instrument
function computeEdgeScore(trades) {
  if (!trades.length) return 0;
  const wins = trades.filter(t => t.pl > 0).length;
  const winRate = (wins / trades.length) * 100;
  const violated = trades.filter(t => t.violations.length > 0).length;
  const adherencePct = ((trades.length - violated) / trades.length) * 100;
  const avgR = trades.reduce((s, t) => s + t.rMultiple, 0) / trades.length;
  const rScore = Math.max(0, Math.min(100, (avgR + 1) * 40));
  return Math.round(winRate * 0.35 + adherencePct * 0.4 + rScore * 0.25);
}

// compares today's trading against trailing history and surfaces behavior, not just P&L
function generateDailyInsight(todaysTrades, allEvaluated) {
  if (todaysTrades.length === 0) return null;
  const todaysPL = todaysTrades.reduce((s, t) => s + t.pl, 0);
  const todaysWinRate = Math.round((todaysTrades.filter(t => t.pl > 0).length / todaysTrades.length) * 100);
  const todaysViolated = todaysTrades.filter(t => t.violations.length > 0);
  const todayKey = dateKey(todaysTrades[0].opened);

  const byDay = {};
  allEvaluated.forEach(t => { const k = dateKey(t.opened); if (k === todayKey) return; (byDay[k] = byDay[k] || []).push(t); });
  const dayEntries = Object.values(byDay);
  const avgDailyPL = dayEntries.length ? dayEntries.reduce((s, d) => s + d.reduce((ss, t) => ss + t.pl, 0), 0) / dayEntries.length : 0;
  const avgWinRate = dayEntries.length ? Math.round(dayEntries.reduce((s, d) => s + (d.filter(t => t.pl > 0).length / d.length) * 100, 0) / dayEntries.length) : todaysWinRate;
  const hasBaseline = dayEntries.length >= 5;

  const plDiff = todaysPL - avgDailyPL;
  const comparison = hasBaseline
    ? `Today closed at ${fmtUSD(todaysPL)}, ${plDiff >= 0 ? "above" : "below"} your typical day by ${fmtUSD(Math.abs(plDiff))}.`
    : `Today closed at ${fmtUSD(todaysPL)} across ${todaysTrades.length} trade${todaysTrades.length !== 1 ? "s" : ""}.`;

  const positives = [];
  const negatives = [];

  if (hasBaseline && todaysWinRate >= avgWinRate + 15) positives.push(`Win rate of ${todaysWinRate}% ran well above your ${avgWinRate}% average — whatever you read today, it worked.`);
  if (hasBaseline && todaysWinRate <= avgWinRate - 15) negatives.push(`Win rate of ${todaysWinRate}% came in well under your ${avgWinRate}% average — worth reviewing entries before the next session.`);

  if (todaysViolated.length === 0) {
    positives.push("Full rule adherence — every trade today respected your active rules.");
  } else {
    const revenge = todaysViolated.some(t => t.violations.some(v => v.includes("after a loss")));
    if (revenge) negatives.push("At least one re-entry landed within 10 minutes of a loss — a classic revenge-trading pattern worth watching for.");
    const violatedCost = todaysViolated.filter(t => t.pl < 0).reduce((s, t) => s + t.pl, 0);
    negatives.push(`${todaysViolated.length} trade${todaysViolated.length !== 1 ? "s" : ""} broke an active rule today${violatedCost < 0 ? `, costing ${fmtUSD(violatedCost)}` : ""}.`);
  }

  const best = todaysTrades.reduce((a, b) => (!a || b.pl > a.pl ? b : a), null);
  const worst = todaysTrades.reduce((a, b) => (!a || b.pl < a.pl ? b : a), null);
  if (best && best.pl > 0) positives.push(`${best.pair} was the standout, closing at ${fmtUSD(best.pl)}.`);
  if (worst && worst.pl < 0 && Math.abs(worst.pl) > Math.abs(avgDailyPL || 20) * 0.4) negatives.push(`${worst.pair} was the heaviest drag on the day, at ${fmtUSD(worst.pl)}.`);

  return { comparison, positives, negatives };
}

function analyzeGroup(trades) {
  const pl = trades.reduce((s, t) => s + t.pl, 0);
  const wins = trades.filter(t => t.pl > 0);
  const losses = trades.filter(t => t.pl < 0);
  const winRate = trades.length ? Math.round((wins.length / trades.length) * 100) : 0;
  const violated = trades.filter(t => t.violations.length > 0);
  const violatedLoss = violated.filter(t => t.pl < 0).reduce((s, t) => s + t.pl, 0);
  const best = trades.reduce((a, b) => (!a || b.pl > a.pl ? b : a), null);
  const worst = trades.reduce((a, b) => (!a || b.pl < a.pl ? b : a), null);
  const pairCounts = {};
  trades.forEach(t => { pairCounts[t.pair] = (pairCounts[t.pair] || 0) + 1; });
  const dominantPair = Object.entries(pairCounts).sort((a, b) => b[1] - a[1])[0]?.[0];
  const avgR = trades.length ? trades.reduce((s, t) => s + t.rMultiple, 0) / trades.length : 0;
  return { pl, wins, losses, winRate, violated, violatedLoss, best, worst, dominantPair, avgR };
}

// one-line, professional — for the summary card preview
function briefNarrative(stats, count) {
  if (count === 0) return "No trades closed in this period.";
  const rulesClause = stats.violated.length > 0
    ? `${stats.violated.length} broke an active rule.`
    : "Full rule adherence.";
  return `${count} trade${count !== 1 ? "s" : ""} closed, ${stats.winRate}% win rate. ${rulesClause}`;
}

// multi-sentence analyst writeup — for the detail page
function extendedNarrative(stats, count, label) {
  if (count === 0) return `No trades were closed during ${label}. Nothing to review here.`;
  const sentences = [];
  sentences.push(`${count} trade${count !== 1 ? "s" : ""} closed for a net result of ${fmtUSD(stats.pl)}, a ${stats.winRate}% win rate against an average of ${fmt(stats.avgR, 2)}R per trade.`);
  if (stats.dominantPair) {
    sentences.push(`Activity concentrated in ${stats.dominantPair}, which carried the majority of the period's decisions.`);
  }
  if (stats.best && stats.worst && stats.best.id !== stats.worst.id) {
    sentences.push(`The standout result was ${stats.best.pair} at ${fmtUSD(stats.best.pl)}; the weakest was ${stats.worst.pair} at ${fmtUSD(stats.worst.pl)}.`);
  }
  if (stats.violated.length > 0) {
    sentences.push(`${stats.violated.length} trade${stats.violated.length !== 1 ? "s" : ""} broke an active rule, accounting for ${fmtUSD(stats.violatedLoss)} of losses in the period — the recurring pattern worth addressing before the next session.`);
  } else {
    sentences.push(`Every trade in the period respected the active rule set — discipline was not the limiting factor here.`);
  }
  return sentences.join(" ");
}

  };
  const persistSettings = async (next) => {
    setSettings(next);
    setGlobalCurrency(next.currency);
    try { await window.storage.set("ledger-settings", JSON.stringify(next), false); } catch (e) { console.error(e); }
  };
  const persistUploadedTrades = async (next) => {
    setUploadedTrades(next);
    try {
      // strip the screenshot data URL before persisting — keeps localStorage usage small;
      // the image itself only needs to live for the current session
      const lean = next.map(({ screenshotUrl, ...rest }) => rest);
      await window.storage.set("ledger-uploaded-trades", JSON.stringify(lean), false);
    } catch (e) { console.error(e); }
  };
  const addUploadedTrades = (trades) => {
    persistUploadedTrades([...uploadedTrades, ...(Array.isArray(trades) ? trades : [trades])]);
  };

  // all trades — starts empty; populated only by what the user uploads
  const ALL_TRADES = useMemo(() => [...uploadedTrades], [uploadedTrades]);

  const tradesByDay = useMemo(() => {
    const map = {};
    ALL_TRADES.forEach(t => { const k = dateKey(t.opened); map[k] = (map[k] || 0) + 1; });
    return map;
  }, [ALL_TRADES]);

  const dayRunningPLMap = useMemo(() => {
    const byDayTrades = {};
    ALL_TRADES.forEach(t => { const k = dateKey(t.opened); (byDayTrades[k] = byDayTrades[k] || []).push(t); });
    const map = {};
    Object.values(byDayTrades).forEach(dayTrades => {
      const sorted = [...dayTrades].sort((a, b) => a.opened - b.opened);
      let running = 0;
      sorted.forEach(t => { running += t.pl; map[t.id] = running; });
    });
    return map;
  }, [ALL_TRADES]);

  const weekRunningPLMap = useMemo(() => {
    const byWeekTrades = {};
    ALL_TRADES.forEach(t => { const k = weekKey(t.opened); (byWeekTrades[k] = byWeekTrades[k] || []).push(t); });
    const map = {};
    Object.values(byWeekTrades).forEach(weekTrades => {
      const sorted = [...weekTrades].sort((a, b) => a.opened - b.opened);
      let running = 0;
      sorted.forEach(t => { running += t.pl; map[t.id] = running; });
    });
    return map;
  }, [ALL_TRADES]);

  // number of consecutive losing trades immediately preceding each trade, in chronological order
  const consecLossMap = useMemo(() => {
    const sorted = [...ALL_TRADES].sort((a, b) => a.opened - b.opened);
    const map = {};
    let streak = 0;
    sorted.forEach(t => {
      map[t.id] = streak;
      streak = t.pl < 0 ? streak + 1 : 0;
    });
    return map;
  }, [ALL_TRADES]);

  const evaluated = useMemo(() => ALL_TRADES.map(t => {
    const { violations, violatedRuleIds } = evaluateTrade(
      t, rules, tradesByDay[dateKey(t.opened)] || 1, dayRunningPLMap[t.id],
      weekRunningPLMap[t.id], consecLossMap[t.id]
    );
    return { ...t, setup: setupOverrides[t.id] || t.setup, violations, violatedRuleIds };
  }).sort((a, b) => b.opened - a.opened), [ALL_TRADES, rules, tradesByDay, dayRunningPLMap, weekRunningPLMap, consecLossMap, setupOverrides]);

  const totalPL = evaluated.reduce((s, t) => s + t.pl, 0);
  const wins = evaluated.filter(t => t.pl > 0).length;
  const winRate = evaluated.length ? Math.round((wins / evaluated.length) * 100) : 0;
  const openPL = OPEN_POSITIONS.reduce((s, p) => s + p.pl, 0);
  const violatedTrades = evaluated.filter(t => t.violations.length > 0);
  const violatedLosses = violatedTrades.filter(t => t.pl < 0).reduce((s, t) => s + t.pl, 0);

  // real equity model — balance and equity are derived from actual trade history, not hardcoded, so every screen agrees
  const balance = (settings.startingBalance != null ? settings.startingBalance : BASE_BALANCE) + totalPL;
  const equity = balance + openPL;
  const todaysPL = evaluated
    .filter(t => dateKey(t.opened) === dateKey(evaluated[0] ? evaluated[0].opened : new Date()))
    .reduce((s, t) => s + t.pl, 0);

  // Edge Score: composite of win rate, rule adherence, avg R-multiple — 0-100.
  // Meaningless with no trades or no rules to check adherence against, so it reads 0 rather than a neutral default.
  const adherencePct = evaluated.length ? Math.round(((evaluated.length - violatedTrades.length) / evaluated.length) * 100) : 100;
  const avgR = evaluated.length ? evaluated.reduce((s, t) => s + t.rMultiple, 0) / evaluated.length : 0;
  const rScore = Math.max(0, Math.min(100, (avgR + 1) * 40));
  const edgeScore = (evaluated.length === 0 || rules.length === 0) ? 0 : Math.round(winRate * 0.35 + adherencePct * 0.4 + rScore * 0.25);

  const byDay = useMemo(() => {
    const map = {};
    evaluated.forEach(t => { const k = dateKey(t.opened); if (!map[k]) map[k] = { key: k, date: t.opened, trades: [] }; map[k].trades.push(t); });
    return Object.values(map).sort((a, b) => b.date - a.date);
  }, [evaluated]);

  const byWeek = useMemo(() => {
    const map = {};
    evaluated.forEach(t => { const k = weekKey(t.opened); if (!map[k]) map[k] = { key: k, start: new Date(k), trades: [] }; map[k].trades.push(t); });
    return Object.values(map).sort((a, b) => b.start - a.start);
  }, [evaluated]);

  const byMonth = useMemo(() => {
    const map = {};
    evaluated.forEach(t => {
      const k = monthKey(t.opened);
      if (!map[k]) map[k] = { key: k, start: new Date(t.opened.getFullYear(), t.opened.getMonth(), 1), trades: [] };
      map[k].trades.push(t);
    });
    return Object.values(map).sort((a, b) => b.start - a.start);
  }, [evaluated]);

  const byQuarter = useMemo(() => {
    const map = {};
    evaluated.forEach(t => {
      const k = quarterKey(t.opened);
      const qIdx = Math.floor(t.opened.getMonth() / 3);
      if (!map[k]) map[k] = { key: k, start: new Date(t.opened.getFullYear(), qIdx * 3, 1), trades: [] };
      map[k].trades.push(t);
    });
    return Object.values(map).sort((a, b) => b.start - a.start);
  }, [evaluated]);

  const byYear = useMemo(() => {
    const map = {};
    evaluated.forEach(t => {
      const k = yearKey(t.opened);
      if (!map[k]) map[k] = { key: k, start: new Date(t.opened.getFullYear(), 0, 1), trades: [] };
      map[k].trades.push(t);
    });
    return Object.values(map).sort((a, b) => b.start - a.start);
  }, [evaluated]);

  const periodGroups = { daily: byDay, weekly: byWeek, monthly: byMonth, quarterly: byQuarter, annual: byYear };

  const chronological = useMemo(() => [...evaluated].reverse(), [evaluated]);
  const activeTradeId = selectedTradeId || (evaluated[0] && evaluated[0].id);
  const activeTrade = evaluated.find(t => t.id === activeTradeId) || evaluated[0];

  // performance metrics for the full account overview
  const perf = useMemo(() => {
    const winsArr = evaluated.filter(t => t.pl > 0);
    const lossArr = evaluated.filter(t => t.pl < 0);
    const grossProfit = winsArr.reduce((s, t) => s + t.pl, 0);
    const grossLoss = Math.abs(lossArr.reduce((s, t) => s + t.pl, 0));
    const profitFactor = grossLoss > 0 ? grossProfit / grossLoss : grossProfit > 0 ? Infinity : 0;
    const avgWin = winsArr.length ? grossProfit / winsArr.length : 0;
    const avgLoss = lossArr.length ? grossLoss / lossArr.length : 0;
    const largestWin = winsArr.reduce((a, t) => Math.max(a, t.pl), 0);
    const largestLoss = lossArr.reduce((a, t) => Math.min(a, t.pl), 0);
    let streak = 0, streakType = null;
    for (const t of evaluated) {
      const type = t.pl >= 0 ? "win" : "loss";
      if (streakType === null) { streakType = type; streak = 1; }
      else if (type === streakType) streak++;
      else break;
    }
    const bySetup = {};
    evaluated.forEach(t => {
      if (!bySetup[t.setup]) bySetup[t.setup] = { trades: 0, wins: 0, pl: 0 };
      bySetup[t.setup].trades++;
      if (t.pl > 0) bySetup[t.setup].wins++;
      bySetup[t.setup].pl += t.pl;
    });
    const byPair = {};
    evaluated.forEach(t => {
      if (!byPair[t.pair]) byPair[t.pair] = { trades: 0, pl: 0 };
      byPair[t.pair].trades++;
      byPair[t.pair].pl += t.pl;
    });
    const ruleTally = {};
    violatedTrades.forEach(t => t.violations.forEach(v => {
      const key = v.split(" ").slice(0, 3).join(" ");
      if (!ruleTally[key]) ruleTally[key] = { count: 0, cost: 0 };
      ruleTally[key].count++;
      if (t.pl < 0) ruleTally[key].cost += t.pl;
    }));
    const patternRanked = Object.entries(ruleTally).map(([key, v]) => ({ key, ...v })).sort((a, b) => a.cost - b.cost);
    const mostBrokenEntry = [...patternRanked].sort((a, b) => b.count - a.count)[0];
    const mostBroken = mostBrokenEntry ? [mostBrokenEntry.key, mostBrokenEntry.count] : null;

    // max drawdown — largest peak-to-trough decline in the running equity curve
    const chronological = [...evaluated].reverse();
    let running = 0, peak = 0, maxDD = 0;
    chronological.forEach(t => {
      running += t.pl;
      if (running > peak) peak = running;
      const dd = peak - running;
      if (dd > maxDD) maxDD = dd;
    });

    return { grossProfit, grossLoss, profitFactor, avgWin, avgLoss, largestWin, largestLoss, streak, streakType, bySetup, byPair, mostBroken, patternRanked, maxDrawdown: maxDD };
  }, [evaluated, violatedTrades]);

  const openSummaryDetail = (period, key, returnTo = "summaries", parent = null) => { setSummaryDetail({ period, key, returnTo, parent }); setPage("summaryDetail"); };
  const backFromSummaryDetail = () => {
    if (summaryDetail && summaryDetail.parent) { setSummaryDetail(summaryDetail.parent); }
    else { setPage((summaryDetail && summaryDetail.returnTo) || "summaries"); }
  };
  const openTradeDetail = (tradeId, returnTo = null) => {
    setTradeDetailId(tradeId);
    setTradeDetailReturn(returnTo || { page });
    setPage("tradeDetail");
  };
  const backFromTradeDetail = () => {
    if (tradeDetailReturn && tradeDetailReturn.page) {
      if (tradeDetailReturn.page === "summaryDetail" && tradeDetailReturn.summaryDetail) setSummaryDetail(tradeDetailReturn.summaryDetail);
      if (tradeDetailReturn.page === "setupDetail" && tradeDetailReturn.setupName) setSetupDetailName(tradeDetailReturn.setupName);
      if (tradeDetailReturn.page === "instrumentDetail" && tradeDetailReturn.pair) setInstrumentDetailPair(tradeDetailReturn.pair);
      setPage(tradeDetailReturn.page);
    } else {
      setPage("dashboard");
    }
  };

  const contextTitle = useMemo(() => {
    if (page === "summaryDetail" && summaryDetail) {
      const groups = periodGroups[summaryDetail.period];
      const group = groups && groups.find(g => g.key === summaryDetail.key);
      if (group) return `${periodLabel(summaryDetail.period, group)} · ${PERIOD_CONFIG[summaryDetail.period].label} Summary`;
    }
    if (page === "setupDetail" && setupDetailName) return `${setupDetailName} · Setup`;
    if (page === "instrumentDetail" && instrumentDetailPair) return `${instrumentDetailPair} · Instrument`;
    if (page === "tradeDetail" && tradeDetailId) {
      const t = evaluated.find(x => x.id === tradeDetailId);
      if (t) return `${t.pair} · Trade Summary`;
    }
    if (page === "allTrades") return "All Trades";
    if (page === "allSummaries") return "All Summaries";
    if (page === "settings") return "Settings";
    return null;
  }, [page, summaryDetail, setupDetailName, instrumentDetailPair, tradeDetailId, evaluated, periodGroups]);

  if (loading) {
    return (
      <div style={{ minHeight: "100vh", background: C.ink, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>
        <ConstructionLoader size={120} />
        <span style={{ color: C.muted, ...mono, fontSize: 12 }}>loading aftertrade…</span>
      </div>
    );
  }

  if (!settings.onboarded) {
    return (
      <div style={{ minHeight: "100vh", color: C.bright, fontFamily: "'Inter', sans-serif", background: C.ink }}>
        <GlobalMotionStyles />
        <OnboardingScreen onFinish={(startingBalance) => persistSettings({ ...settings, onboarded: true, startingBalance })} />
      </div>
    );
  }

  return (
    <div style={{
      minHeight: "100vh", color: C.bright, fontFamily: "'Inter', sans-serif",
      background: C.ink,
    }}>
      <GlobalMotionStyles />
      <TopBar page={page} setPage={setPage} contextTitle={contextTitle} />
      <div className="at-container" style={{ maxWidth: 960, margin: "0 auto", padding: "28px 20px 80px" }}>
        {page === "dashboard" && (
          <Dashboard
            evaluated={evaluated} openPL={openPL} totalPL={totalPL} winRate={winRate} wins={wins}
            violatedTrades={violatedTrades} violatedLosses={violatedLosses} setPage={setPage} setSummaryPeriod={setSummaryPeriod}
            edgeScore={edgeScore} adherencePct={adherencePct} avgR={avgR} rules={rules} setups={setups}
            chronological={chronological} activeTrade={activeTrade} selectedTradeId={activeTradeId} setSelectedTradeId={setSelectedTradeId}
            showWelcome={!settings.hasSeenWelcome} onDismissWelcome={() => persistSettings({ ...settings, hasSeenWelcome: true })}
            balance={balance} equity={equity} perf={perf} openSummaryDetail={openSummaryDetail}
            openTradeDetail={(id) => openTradeDetail(id, { page: "dashboard" })}
            onUploadTrade={() => setShowUploadModal(true)}
          />
        )}
        {page === "account" && (
          <AccountPage
            totalPL={totalPL} openPL={openPL} winRate={winRate} wins={wins} evaluated={evaluated}
            violatedTrades={violatedTrades} violatedLosses={violatedLosses} edgeScore={edgeScore}
            adherencePct={adherencePct} avgR={avgR} perf={perf} setPage={setPage}
            balance={balance} equity={equity} todaysPL={todaysPL}
          />
        )}
        {page === "autopsy" && (
          <JournalCalendarPage periodGroups={periodGroups} onOpenPeriod={(period, key) => openSummaryDetail(period, key, "autopsy")} />
        )}
        {page === "rules" && (
          <RulesPage rules={rules} persistRules={persistRules} newRuleType={newRuleType} setNewRuleType={setNewRuleType} evaluated={evaluated} />
        )}
        {page === "summaries" && (
          <SummariesPage
            period={summaryPeriod} setPeriod={setSummaryPeriod} periodGroups={periodGroups}
            onOpenDetail={openSummaryDetail} setPage={setPage}
          />
        )}
        {page === "summaryDetail" && summaryDetail && (
          <SummaryDetailPage
            detail={summaryDetail} periodGroups={periodGroups} onBack={backFromSummaryDetail}
            onOpenSub={(p, k) => openSummaryDetail(p, k, undefined, summaryDetail)}
            onOpenTrade={(id) => openTradeDetail(id, { page: "summaryDetail", summaryDetail })}
          />
        )}
        {page === "allTrades" && (
          <AllTradesPage evaluated={evaluated} setups={setups} setPage={setPage} onOpenTrade={(id) => openTradeDetail(id, { page: "allTrades" })} onUploadTrade={() => setShowUploadModal(true)} />
        )}
        {page === "allSummaries" && (
          <AllSummariesPage period={summaryPeriod} periodGroups={periodGroups} onOpenDetail={openSummaryDetail} setPage={setPage} />
        )}
        {page === "settings" && (
          <SettingsPage settings={settings} persistSettings={persistSettings} setPage={setPage} onUploadTrade={() => setShowUploadModal(true)} uploadedTrades={uploadedTrades} />
        )}
        {page === "setupLibrary" && (
          <SetupLibraryPage
            perf={perf} setups={setups} persistSetups={persistSetups}
            newSetupName={newSetupName} setNewSetupName={setNewSetupName}
            newSetupCriteria={newSetupCriteria} setNewSetupCriteria={setNewSetupCriteria}
            setPage={setPage} onOpenSetup={(name) => { setSetupDetailName(name); setPage("setupDetail"); }}
          />
        )}
        {page === "setupDetail" && (
          <SetupDetailPage name={setupDetailName} evaluated={evaluated} setPage={setPage} onOpenTrade={(id) => openTradeDetail(id, { page: "setupDetail", setupName: setupDetailName })} />
        )}
        {page === "instrumentLibrary" && (
          <InstrumentLibraryPage
            perf={perf} setPage={setPage}
            onOpenInstrument={(pair) => { setInstrumentDetailPair(pair); setPage("instrumentDetail"); }}
          />
        )}
        {page === "instrumentDetail" && (
          <InstrumentDetailPage pair={instrumentDetailPair} evaluated={evaluated} setPage={setPage} onOpenTrade={(id) => openTradeDetail(id, { page: "instrumentDetail", pair: instrumentDetailPair })} />
        )}
        {page === "tradeDetail" && (
          <TradeSummaryPage
            trade={evaluated.find(t => t.id === tradeDetailId)} setups={setups}
            onChangeSetup={(newSetup) => persistSetupOverrides({ ...setupOverrides, [tradeDetailId]: newSetup })}
            onBack={backFromTradeDetail}
          />
        )}
      </div>
      {showUploadModal && (
        <div
          onClick={() => setShowUploadModal(false)}
          style={{
            position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", zIndex: 200,
            display: "flex", alignItems: "center", justifyContent: "center", padding: 20, overflowY: "auto",
          }}
        >
          <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 380, position: "relative" }}>
            <button
              onClick={() => setShowUploadModal(false)}
              style={{
                position: "absolute", top: -34, right: 0, background: "none", border: "none",
                color: C.faint, cursor: "pointer", display: "flex", padding: 4,
              }}
              aria-label="Close"
            >
              <X size={18} />
            </button>
            <TradeScreenshotFlow
              setups={setups}
              confirmLabel="Log this trade"
              onConfirm={(trades) => { addUploadedTrades(trades); setShowUploadModal(false); }}
              extractionApiUrl={settings.extractionApiUrl}
            />
          </div>
        </div>
      )}
    </div>
  );
}

function TopBar({ page, setPage, contextTitle }) {
  const NAV = [
    { id: "dashboard", label: "Dashboard" },
    { id: "account", label: "Account" },
    { id: "autopsy", label: "Journal" },
    { id: "summaries", label: "Summaries" },
    { id: "rules", label: "Rules" },
    { id: "setupLibrary", label: "Setup Library" },
    { id: "instrumentLibrary", label: "Instrument Library" },
  ];
  const [navOpen, setNavOpen] = useState(false);
  const current = NAV.find(n => n.id === page);

  const go = (id) => { setPage(id); setNavOpen(false); };

  return (
    <div style={{ position: "sticky", top: 0, zIndex: 30, background: C.ink, borderBottom: `1px solid ${C.hair}` }}>
      {/* row 1: settings — centered brand — mock data badge */}
      <div className="at-container" style={{ maxWidth: 960, margin: "0 auto", padding: "14px 20px 10px", display: "grid", gridTemplateColumns: "1fr auto 1fr", alignItems: "center", gap: 12 }}>
        <div style={{ justifySelf: "start" }}>
          <button onClick={() => setPage("settings")} style={{ background: "none", border: `1px solid ${C.hair}`, borderRadius: 2, width: 32, height: 32, color: page === "settings" ? C.teal : C.muted, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Settings size={15} />
          </button>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", justifySelf: "center" }} onClick={() => setPage("dashboard")}>
          <img src={APP_ICON_URI} alt="Aftertrade" style={{ width: 30, height: 30, borderRadius: 2, display: "block", flexShrink: 0 }} />
          <span style={{ ...display, fontWeight: 800, fontSize: 21, letterSpacing: "-0.02em", color: C.bright, lineHeight: 1, whiteSpace: "nowrap" }}>
            <span style={{ color: C.teal }}>after</span>trade
          </span>
        </div>

        <div className="at-hide-mobile" style={{ justifySelf: "end", ...mono, fontSize: 10.5, color: C.muted, display: "flex", alignItems: "center", gap: 6, border: `1px solid ${C.hair}`, borderRadius: 2, padding: "5px 11px" }}>
          <span style={{ width: 6, height: 6, borderRadius: 99, background: C.teal, display: "inline-block" }} />
          MOCK DATA
        </div>
      </div>

      {/* row 2: dropdown nav trigger, centered */}
      <div style={{ borderTop: `1px solid ${C.hairSoft}`, position: "relative", display: "flex", justifyContent: "center" }}>
        <button onClick={() => setNavOpen(o => !o)} style={{
          background: "none", border: "none", cursor: "pointer", padding: "10px 16px",
          display: "flex", alignItems: "center", gap: 6, fontSize: 13, fontWeight: 600, color: C.bright,
        }}>
          {current ? current.label : (contextTitle || "Menu")}
          <ChevronDown size={14} color={C.teal} style={{ transform: navOpen ? "rotate(180deg)" : "none", transition: "transform 0.15s ease" }} />
        </button>

        {navOpen && (
          <>
            <div onClick={() => setNavOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 25 }} />
            <div className="at-pop-in" style={{
              position: "absolute", top: "100%", marginTop: 6, background: C.panel, border: `1px solid ${C.hairSoft}`,
              borderRadius: 2, overflow: "hidden", zIndex: 26, minWidth: 200,
            }}>
              {NAV.map(n => (
                <button key={n.id} onClick={() => go(n.id)} style={{
                  display: "block", width: "100%", textAlign: "left", background: page === n.id ? "rgba(18,155,156,0.1)" : "none",
                  border: "none", borderBottom: `1px solid ${C.hairSoft}`, padding: "12px 18px", cursor: "pointer",
                  fontSize: 13.5, fontWeight: page === n.id ? 600 : 500, color: page === n.id ? C.teal : C.bright,
                }}>{n.label}</button>
              ))}
            </div>
          </>
        )}
      </div>
    </div>

// collapses raw trades into day/week/month buckets for the Tape's granularity control
// caps each granularity level to a rolling window — an aggregated-but-unwindowed chart is still too crowded over a full year
const TAPE_WINDOW_DAYS = { trade: 30, day: 84, week: 182, month: null };
const TAPE_WINDOW_LABELS = { trade: "last 30 days", day: "last 12 weeks", week: "last 6 months", month: "full history" };
function windowTradesForTape(trades, granularity) {
  const days = TAPE_WINDOW_DAYS[granularity];
  if (!days || !trades.length) return trades;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  return trades.filter(t => t.opened >= cutoff);
}

function aggregateForTape(trades, granularity) {
  if (granularity === "trade") {
    return trades.map(t => ({ key: t.id, isAggregate: false, trades: [t], pl: t.pl, start: t.opened, date: t.opened }));
  }
  const keyFn = granularity === "day" ? dateKey : granularity === "week" ? weekKey : monthKey;
  const map = {};
  const order = [];
  trades.forEach(t => {
    const k = keyFn(t.opened);
    if (!map[k]) { map[k] = { key: k, isAggregate: true, trades: [], start: t.opened, date: t.opened }; order.push(k); }
    map[k].trades.push(t);
    if (t.opened < map[k].start) { map[k].start = t.opened; map[k].date = t.opened; }
  });
  return order.map(k => { const g = map[k]; return { ...g, pl: g.trades.reduce((s, x) => s + x.pl, 0) }; });
}

const TAPE_GRANULARITIES = [
  { id: "trade", label: "Trade" },
  { id: "day", label: "Day" },
  { id: "week", label: "Week" },
  { id: "month", label: "Month" },
];
const GRANULARITY_TO_PERIOD = { day: "daily", week: "weekly", month: "monthly" };

function Tape({ trades, granularity = "trade", onViewPeriodSummary, onViewTrade, height = 360, width = null, zoom = 1, onUploadTrade }) {
  const windowedTrades = useMemo(() => windowTradesForTape(trades, granularity), [trades, granularity]);
  const units = useMemo(() => aggregateForTape(windowedTrades, granularity), [windowedTrades, granularity]);
  const [selectedKey, setSelectedKey] = useState(null);
  const [collapsed, setCollapsed] = useState(false);
  useEffect(() => {
    setSelectedKey(units.length ? units[units.length - 1].key : null);
    setCollapsed(false);
  }, [units]);
  useEffect(() => { setCollapsed(false); }, [selectedKey]);

  const spacing = 68 * zoom;
  const nodeR = 5 * Math.max(0.6, Math.min(1, zoom));
  const axisLabelWidth = 62; // reserved left gutter for equity axis labels
  const marginX = 24; // small aesthetic padding only — the chart starts near the left edge
  const span = units.length > 1 ? (units.length - 1) * spacing : 0;
  const w = width || Math.max(marginX * 2 + 40, marginX + span + marginX);
  const midY = 250; // bottom-biased baseline — bakes in generous headroom above for the callout bubble
  const amp = 85; // min y = 165 (plenty of clearance for the ~110px bubble), max y = 335

  // running cumulative total, reset at the start of the current window — reads like "what happened in this window," not a random fragment of the full history
  let running = 0;
  const cumulative = units.map(u => { running += u.pl; return running; });
  const maxAbs = Math.max(1, ...cumulative.map(v => Math.abs(v)));

  const points = units.map((u, i) => {
    const x = marginX + i * spacing;
    const y = midY - (cumulative[i] / maxAbs) * amp;
    return { x, y, u };
  });

  const pathD = points.map((p, i) => (i === 0 ? `M ${p.x},${p.y}` : `L ${p.x},${p.y}`)).join(" ");
  const selectedPoint = points.find(p => p.u.key === selectedKey);
  const firstTrade = windowedTrades[0], lastTrade = windowedTrades[windowedTrades.length - 1];

  if (windowedTrades.length === 0) {
    const noTradesAtAll = trades.length === 0;
    return (
      <div style={{ padding: "40px 20px" }}>
        <EmptyState
          title={noTradesAtAll ? "No trades logged yet" : `No trades in the ${TAPE_WINDOW_LABELS[granularity]}`}
          note={noTradesAtAll ? "Upload a screenshot to log your first trade." : "Try a wider view, like Week or Month."}
        />
        {noTradesAtAll && onUploadTrade && (
          <div style={{ display: "flex", justifyContent: "center", marginTop: 16 }}>
            <button onClick={onUploadTrade} style={{
              display: "flex", alignItems: "center", gap: 6, background: C.teal, color: C.ink, border: "none",
              borderRadius: 2, padding: "10px 18px", cursor: "pointer", ...mono, fontSize: 12.5, fontWeight: 700,
            }}>
              <Plus size={13} /> Upload your first trade
            </button>
          </div>
        )}
      </div>
    );
  }

  // clamp the bubble's horizontal position to stay within the chart bounds — no permanent margin needed for this
  const bubbleW = 260;
  const half = bubbleW / 2;
  let bubbleCenterX = selectedPoint ? selectedPoint.x : 0;
  if (selectedPoint) {
    if (bubbleCenterX - half < 0) bubbleCenterX = half;
    else if (bubbleCenterX + half > w) bubbleCenterX = w - half;
  }
  const tailOffsetPx = selectedPoint ? half + (selectedPoint.x - bubbleCenterX) - 6.5 : 0;
  // flip the bubble below the node when it's too close to the top of the chart to fit above —
  // otherwise its close button gets clipped by the scroll container with no way to reach it
  const flipBelow = selectedPoint ? selectedPoint.y < 210 : false;
  const bubbleWrapStyle = selectedPoint ? {
    position: "absolute", left: bubbleCenterX, top: selectedPoint.y,
    transform: flipBelow ? "translate(-50%, 16px)" : "translate(-50%, calc(-100% - 16px))",
    zIndex: 5,
  } : null;
  const tailStyle = flipBelow
    ? { position: "absolute", top: -7, left: tailOffsetPx, transform: "rotate(45deg)", width: 13, height: 13, background: C.panel, borderLeft: `1px solid ${C.teal}`, borderTop: `1px solid ${C.teal}` }
    : { position: "absolute", bottom: -7, left: tailOffsetPx, transform: "rotate(45deg)", width: 13, height: 13, background: C.panel, borderRight: `1px solid ${C.teal}`, borderBottom: `1px solid ${C.teal}` };

  return (
    <div style={{ overflowX: "auto", padding: "20px 8px 16px" }}>
      <div style={{ width: w + axisLabelWidth, position: "relative" }}>
        {/* equity axis, left side */}
        <div style={{ position: "absolute", left: 0, top: 0, width: axisLabelWidth, height, pointerEvents: "none" }}>
          <span style={{ position: "absolute", top: midY - amp - 6, left: 0, ...mono, fontSize: 10, color: C.faint }}>{fmtUSD(maxAbs)}</span>
          <span style={{ position: "absolute", top: midY - 6, left: 0, ...mono, fontSize: 10, color: C.faint }}>{fmtUSD(0)}</span>
          <span style={{ position: "absolute", top: midY + amp - 6, left: 0, ...mono, fontSize: 10, color: C.faint }}>{fmtUSD(-maxAbs)}</span>
        </div>

        <div style={{ marginLeft: axisLabelWidth, position: "relative", width: w }}>
        <svg width={w} height={height} viewBox={`0 0 ${w} ${height}`}>
          <line x1={0} y1={midY - amp} x2={w} y2={midY - amp} stroke={C.hairSoft} strokeWidth="1" strokeDasharray="2 4" />
          <line x1={0} y1={midY} x2={w} y2={midY} stroke={C.hair} strokeWidth="1" />
          <line x1={0} y1={midY + amp} x2={w} y2={midY + amp} stroke={C.hairSoft} strokeWidth="1" strokeDasharray="2 4" />
          <path d={pathD} fill="none" stroke={C.teal} strokeWidth="1.5" opacity="0.6" />
          {points.map((p, i) => {
            const isWin = p.u.pl >= 0;
            const isViolated = p.u.trades.some(t => t.violations.length > 0);
            const isSelected = p.u.key === selectedKey;
            return (
              <g key={p.u.key} onClick={() => setSelectedKey(p.u.key)} style={{ cursor: "pointer" }}>
                {isSelected && <circle cx={p.x} cy={p.y} r={nodeR + 7} fill="none" stroke={C.teal} strokeWidth="1.5" strokeDasharray="2 3" />}
                {isViolated ? (
                  <>
                    <circle cx={p.x} cy={p.y} r={nodeR + 1} fill={C.ink} stroke={C.amber} strokeWidth="2.5" />
                    <circle cx={p.x} cy={p.y} r={nodeR - 3} fill={isWin ? C.green : C.red} />
                  </>
                ) : (
                  <circle cx={p.x} cy={p.y} r={nodeR} fill={isWin ? C.green : C.red} />
                )}
                {isSelected && collapsed && (
                  <circle cx={p.x} cy={p.y} r={nodeR + 7} fill="none" stroke={C.teal} strokeWidth="1" strokeDasharray="1 3" opacity="0.6" />
                )}
                <circle cx={p.x} cy={p.y} r={16} fill="transparent" />
              </g>
            );
          })}
        </svg>

        {selectedPoint && !collapsed && (() => {
          const u = selectedPoint.u;
          const isWin = u.pl >= 0;

          if (!u.isAggregate) {
            const t = u.trades[0];
            return (
              <div style={bubbleWrapStyle} className="at-pop-in">
                <div style={{
                  background: C.panel, border: `1px solid ${C.teal}`, borderRadius: 2,
                  width: 260,
                  position: "relative", overflow: "hidden", pointerEvents: "auto",
                }}>
                  <button
                    onClick={(e) => { e.stopPropagation(); setCollapsed(true); }}
                    style={{
                      position: "absolute", top: 6, right: 6, background: "none", border: "none",
                      color: C.faint, cursor: "pointer", padding: 4, display: "flex", zIndex: 2,
                    }}
                    aria-label="Collapse trade info"
                  >
                    <X size={13} />
                  </button>
                  <div style={{ display: "flex" }}>
                    <div style={{ width: 52, flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2, background: isWin ? C.greenDim : C.redDim, borderRight: `1px solid ${C.hair}` }}>
                      <span style={{ ...mono, fontWeight: 700, fontSize: 12.5, color: isWin ? C.green : C.red }}>{fmt(t.plPct)}%</span>
                      <span style={{ ...mono, fontSize: 8, textTransform: "uppercase", color: C.muted }}>{isWin ? "win" : "loss"}</span>
                    </div>
                    <div style={{ flex: 1, padding: "10px 26px 10px 12px", minWidth: 0 }}>
                      <div style={{ ...display, fontWeight: 600, fontSize: 13, marginBottom: 2 }}>{t.pair} · {t.side}</div>
                      <div style={{ ...mono, fontSize: 9.5, color: C.muted, lineHeight: 1.4 }}>{t.setup} · {t.vol} lots</div>
                      <div style={{ ...mono, fontSize: 9.5, color: C.muted, lineHeight: 1.4 }}>held {t.heldMin}m · {dateLabel(t.opened)}</div>
                    </div>
                    <div style={{ width: 76, flexShrink: 0, padding: "10px 10px", display: "flex", flexDirection: "column", justifyContent: "center", gap: 2, borderLeft: `1px solid ${C.hair}` }}>
                      <div style={{ ...mono, fontSize: 8, textTransform: "uppercase", color: C.faint }}>P/L</div>
                      <div style={{ ...mono, fontWeight: 700, fontSize: 12.5, color: isWin ? C.green : C.red }}>{fmtUSD(t.pl)}</div>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 5, flexWrap: "wrap", padding: "0 12px 10px" }}>
                    {t.violations.length === 0 ? (
                      <span style={{ ...mono, fontSize: 9.5, padding: "3px 8px", borderRadius: 2, border: `1px solid ${C.greenDim}`, color: C.green }}>No rule violations</span>
                    ) : t.violations.map((v, i) => (
                      <span key={i} style={{ ...mono, fontSize: 9.5, padding: "3px 8px", borderRadius: 2, border: `1px solid ${C.redDim}`, color: C.red, display: "flex", alignItems: "center", gap: 4 }}>
                        <AlertTriangle size={9} /> {v}
                      </span>
                    ))}
                  </div>
                  {onViewTrade && (
                    <button
                      onClick={(e) => { e.stopPropagation(); onViewTrade(t.id); }}
                      style={{
                        width: "100%", background: C.tealDim, border: "none", borderTop: `1px solid ${C.hairSoft}`,
                        color: C.teal, cursor: "pointer", padding: "9px 14px", ...mono, fontSize: 10.5, fontWeight: 600,
                        textAlign: "left", display: "flex", alignItems: "center", justifyContent: "space-between",
                      }}
                    >
                      View trade summary <ChevronRight size={12} />
                    </button>
                  )}
                  {/* speech-bubble tail, pointing to the actual node — flips with the bubble when clamped near the top */}
                  <div style={tailStyle} />
                </div>
              </div>
            );
          }

          // aggregated point — a period summary bubble instead of a single trade
          const periodStats = analyzeGroup(u.trades);
          const periodType = GRANULARITY_TO_PERIOD[granularity];
          const label = periodLabel(periodType, u);
          return (
            <div style={bubbleWrapStyle} className="at-pop-in">
              <div style={{
                background: C.panel, border: `1px solid ${C.teal}`, borderRadius: 2,
                width: 260, position: "relative", pointerEvents: "auto",
              }}>
                <button
                  onClick={(e) => { e.stopPropagation(); setCollapsed(true); }}
                  style={{
                    position: "absolute", top: 6, right: 6, background: "none", border: "none",
                    color: C.faint, cursor: "pointer", padding: 4, display: "flex", zIndex: 2,
                  }}
                  aria-label="Collapse period info"
                >
                  <X size={13} />
                </button>
                <div style={{ padding: "12px 26px 10px 14px" }}>
                  <div style={{ ...display, fontWeight: 600, fontSize: 13, marginBottom: 6 }}>{label}</div>
                  <div style={{ display: "flex", gap: 16, marginBottom: 8 }}>
                    <div>
                      <div style={{ ...mono, fontSize: 8, textTransform: "uppercase", color: C.faint }}>Trades</div>
                      <div style={{ ...mono, fontSize: 13, fontWeight: 700, color: C.bright }}>{u.trades.length}</div>
                    </div>
                    <div>
                      <div style={{ ...mono, fontSize: 8, textTransform: "uppercase", color: C.faint }}>Win rate</div>
                      <div style={{ ...mono, fontSize: 13, fontWeight: 700, color: C.bright }}>{periodStats.winRate}%</div>
                    </div>
                    <div>
                      <div style={{ ...mono, fontSize: 8, textTransform: "uppercase", color: C.faint }}>Net P/L</div>
                      <div style={{ ...mono, fontSize: 13, fontWeight: 700, color: isWin ? C.green : C.red }}>{fmtUSD(u.pl)}</div>
                    </div>
                  </div>
                  {periodStats.violated.length > 0 && (
                    <div style={{ ...mono, fontSize: 9.5, color: C.amber, display: "flex", alignItems: "center", gap: 4, marginBottom: 8 }}>
                      <AlertTriangle size={10} /> {periodStats.violated.length} rule violation{periodStats.violated.length !== 1 ? "s" : ""}
                    </div>
                  )}
                </div>
                {onViewPeriodSummary && (
                  <button
                    onClick={(e) => { e.stopPropagation(); onViewPeriodSummary(periodType, u.key); }}
                    style={{
                      width: "100%", background: C.tealDim, border: "none", borderTop: `1px solid ${C.hairSoft}`,
                      color: C.teal, cursor: "pointer", padding: "9px 14px", ...mono, fontSize: 10.5, fontWeight: 600,
                      textAlign: "left", display: "flex", alignItems: "center", justifyContent: "space-between",
                    }}
                  >
                    View full summary <ChevronRight size={12} />
                  </button>
                )}
                {/* speech-bubble tail, pointing to the actual node — flips with the bubble when clamped near the top */}
                <div style={tailStyle} />
              </div>
            </div>
          );
        })()}
        </div>

        <div style={{ position: "absolute", left: axisLabelWidth, top: height + 4, width: w, textAlign: "center" }}>
          {firstTrade && lastTrade && (
            <span style={{ ...mono, fontSize: 10.5, color: C.faint }}>
              {dateLabel(firstTrade.opened)} – {dateLabel(lastTrade.opened)} · {TAPE_WINDOW_LABELS[granularity]}
            </span>
          )}
        </div>
        <div style={{ height: 22 }} />
      </div>
    </div>
  );
}

function TapeLegend() {
  const item = (color, label, ring) => (
    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
      <div style={{ width: 8, height: 8, borderRadius: 99, background: ring ? C.ink : color, border: ring ? `2px solid ${C.amber}` : "none" }} />
      <span style={{ ...mono, fontSize: 10, color: C.faint }}>{label}</span>
    </div>
  );
  return (
    <div style={{ display: "flex", gap: 18, padding: "0 22px 18px" }}>
      {item(C.green, "Win")}
      {item(C.red, "Loss")}
      {item(null, "Rule violation", true)}
    </div>
  );
}

function SelectedTradeCard({ t }) {
  if (!t) return null;
  const isWin = t.pl >= 0;
  return (
    <Card style={{ display: "flex", overflow: "hidden", marginBottom: 30 }}>
      <div style={{ width: 66, flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3, background: isWin ? C.greenDim : C.redDim, borderRight: `1px solid ${C.hair}` }}>
        <span style={{ ...mono, fontWeight: 700, fontSize: 14, color: isWin ? C.green : C.red }}>{fmt(t.plPct)}%</span>
        <span style={{ ...mono, fontSize: 9, textTransform: "uppercase", color: C.muted }}>{isWin ? "win" : "loss"}</span>
      </div>
      <div style={{ flex: 1, padding: 18 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 7, flexWrap: "wrap" }}>
          <span style={{ ...display, fontWeight: 600, fontSize: 15 }}>{t.pair} · {t.side}</span>
          <span style={{ ...mono, fontSize: 11, color: C.muted }}>{t.setup} · {t.vol} lots · held {t.heldMin}m · {dateLabel(t.opened)}</span>
        </div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {t.violations.length === 0 ? (
            <span style={{ ...mono, fontSize: 10.5, padding: "3px 9px", borderRadius: 2, border: `1px solid ${C.greenDim}`, color: C.green }}>No rule violations</span>
          ) : t.violations.map((v, i) => (
            <span key={i} style={{ ...mono, fontSize: 10.5, padding: "3px 9px", borderRadius: 2, border: `1px solid ${C.redDim}`, color: C.red, display: "flex", alignItems: "center", gap: 4 }}>
              <AlertTriangle size={10} /> {v}
            </span>
          ))}
        </div>
      </div>
      <div style={{ width: 110, flexShrink: 0, padding: 16, display: "flex", flexDirection: "column", justifyContent: "center", gap: 2, borderLeft: `1px solid ${C.hair}` }}>
        <div style={{ ...mono, fontSize: 9, textTransform: "uppercase", color: C.faint }}>P/L</div>
        <div style={{ ...mono, fontWeight: 700, fontSize: 14, color: isWin ? C.green : C.red }}>{fmtUSD(t.pl)}</div>
      </div>
    </Card>
  );
}

function Dashboard({ evaluated, openPL, totalPL, winRate, wins, violatedTrades, violatedLosses, setPage, setSummaryPeriod, edgeScore, adherencePct, avgR, rules, setups, chronological, activeTrade, selectedTradeId, setSelectedTradeId, showWelcome, onDismissWelcome, balance, equity, perf, openSummaryDetail, openTradeDetail, onUploadTrade }) {
  const activeRules = rules.filter(r => r.active).length;
  const topSetup = perf.bySetup && Object.keys(perf.bySetup).length
    ? Object.entries(perf.bySetup).sort((a, b) => b[1].pl - a[1].pl)[0]
    : null;
  const topPair = perf.byPair && Object.keys(perf.byPair).length
    ? Object.entries(perf.byPair).sort((a, b) => b[1].pl - a[1].pl)[0]
    : null;
  const recentFive = evaluated.slice(0, 5).reverse();
  const recentTrendValues = recentFive.map(t => t.pl);
  const recentStreak = recentFive.map(t => t.pl >= 0);
  const plLabel = "Total P/L";
  const plValue = totalPL;
  const plSub = "all trades";
  const edgeColor = edgeScore >= 70 ? C.green : edgeScore >= 45 ? C.amber : C.red;

  const [summaryUnlocked, setSummaryUnlocked] = useState(false);
  const [zoom, setZoom] = useState(1);
  const [granularity, setGranularity] = useState("trade");
  const handleFitAll = () => {
    const approxContainerWidth = typeof window !== "undefined" ? Math.min(860, window.innerWidth - 80) : 860; // usable width inside the Tape card
    const axisLabelWidth = 62, marginX = 24; // must match Tape's own constants
    const n = aggregateForTape(windowTradesForTape(chronological, granularity), granularity).length;
    if (n <= 1) { setZoom(1); return; }
    const usable = approxContainerWidth - axisLabelWidth - marginX * 2;
    const raw = usable / ((n - 1) * 68);
    setZoom(Math.max(0.02, Math.min(1.4, raw)));
  };
  useEffect(() => { handleFitAll(); }, [granularity]); // eslint-disable-line react-hooks/exhaustive-deps
  const todaysTrades = useMemo(() => {
    if (!evaluated[0]) return [];
    const k = dateKey(evaluated[0].opened);
    return evaluated.filter(t => dateKey(t.opened) === k);
  }, [evaluated]);
  const todaysPL = todaysTrades.reduce((s, t) => s + t.pl, 0);
  const todaysWins = todaysTrades.filter(t => t.pl > 0).length;
  const todaysViolations = todaysTrades.filter(t => t.violations.length > 0);
  const dominant = todaysTrades.filter(t => t.pl < 0).length > todaysWins ? "Losses outnumbered wins today." : "Wins outnumbered losses today.";
  const dailyInsight = useMemo(() => generateDailyInsight(todaysTrades, evaluated), [todaysTrades, evaluated]);

  const lossLimitRule = rules.find(r => r.type === "dailyLossLimit" && r.active);
  const riskPct = lossLimitRule ? Math.min(150, Math.round((Math.max(0, -todaysPL) / lossLimitRule.value) * 100)) : 0;
  const riskLevel = riskPct >= 100 ? "breached" : riskPct >= 70 ? "warning" : "ok";

  const equityAnim = useCountUp(equity);
  const plAnim = useCountUp(plValue);
  const edgeAnim = useCountUp(edgeScore, 1100);

  return (
    <div>
      {showWelcome && (
        <div className="at-fade-in" style={{
          display: "flex", alignItems: "flex-start", gap: 12, padding: "16px 18px", borderRadius: 2, marginBottom: 18,
          background: C.panel, border: `1px solid ${C.teal}`,
        }}>
          <Sparkles size={16} color={C.teal} style={{ flexShrink: 0, marginTop: 2 }} />
          <div style={{ flex: 1 }}>
            <div style={{ ...display, fontWeight: 600, fontSize: 14, marginBottom: 5 }}>You're connected — here's the idea</div>
            <p style={{ fontSize: 12.5, color: C.body, lineHeight: 1.6, margin: 0 }}>
              <b style={{ color: C.bright }}>The Tape</b> is your running equity curve — click any dot to see that trade's full story.{" "}
              <b style={{ color: C.bright }}>Edge Score</b> blends your win rate, rule adherence, and average R-multiple into one number worth checking daily.
            </p>
          </div>
          <button onClick={onDismissWelcome} style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 4, flexShrink: 0 }}>
            <X size={15} />
          </button>
        </div>
      )}
      {lossLimitRule && riskLevel !== "ok" && (
        <div className="at-fade-in" style={{
          display: "flex", alignItems: "center", gap: 10, padding: "12px 16px", borderRadius: 2, marginBottom: 16,
          background: riskLevel === "breached" ? C.redDim : "rgba(232,163,61,0.08)",
          border: `1px solid ${riskLevel === "breached" ? C.red : C.amber}`,
        }}>
          <AlertTriangle size={15} color={riskLevel === "breached" ? C.red : C.amber} />
          <span style={{ fontSize: 12.5, color: C.body, flex: 1 }}>
            {riskLevel === "breached"
              ? <>Today's loss <b style={{ color: C.red }}>{fmtUSD(todaysPL)}</b> has passed your {fmtUSD(-lossLimitRule.value)} daily limit.</>
              : <>Today's loss <b style={{ color: C.amber }}>{fmtUSD(todaysPL)}</b> is at {riskPct}% of your {fmtUSD(-lossLimitRule.value)} daily limit.</>}
          </span>
        </div>
      )}
      {/* THE TAPE — the one dominant instrument, everything else stays quiet by comparison */}
      <div className="at-fade-in" style={{ animationDelay: "0s" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, flexWrap: "wrap", gap: 10 }}>
          <div>
            <div style={{ ...mono, fontSize: 10.5, letterSpacing: "0.1em", textTransform: "uppercase", color: C.faint }}>The Tape</div>
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <GranularityControls granularity={granularity} setGranularity={setGranularity} />
            <ZoomControls zoom={zoom} setZoom={setZoom} onFit={handleFitAll} />
          </div>
        </div>

        <Card style={{ marginBottom: 16, position: "relative", overflow: "hidden", border: `1px solid ${C.hairSoft}` }}>
          <div
            className="at-tape-header"
            onClick={() => setPage("account")}
            style={{ position: "relative", zIndex: 1, display: "flex", alignItems: "flex-start", justifyContent: "space-between", padding: "26px 24px 6px", flexWrap: "wrap", gap: 16, cursor: "pointer" }}
            onMouseEnter={(e) => e.currentTarget.style.opacity = "0.92"}
            onMouseLeave={(e) => e.currentTarget.style.opacity = "1"}
          >
            <div style={{ display: "flex", gap: 32, flexWrap: "wrap", alignItems: "baseline" }}>
              <div>
                <div style={{ ...mono, fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: C.faint, marginBottom: 7, display: "flex", alignItems: "center", gap: 6 }}>
                  <span className="at-pulse" style={{ width: 5, height: 5, borderRadius: 99, background: C.teal, display: "inline-block" }} />
                  Equity
                </div>
                <div className="at-equity-num" style={{ ...display, fontSize: 34, fontWeight: 700, letterSpacing: "-0.01em" }}>{fmtMoney(equityAnim)}</div>
              </div>
              <div>
                <div style={{ ...mono, fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: C.faint, marginBottom: 7 }}>Edge</div>
                <div className="at-edge-num" style={{ ...display, fontSize: 26, fontWeight: 700, color: edgeColor }}>{Math.round(edgeAnim)}</div>
              </div>
            </div>
            <div style={{ display: "flex", gap: 24, flexWrap: "wrap", alignItems: "center" }}>
              <div style={{ textAlign: "right" }}>
                <div style={{ ...mono, fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: C.faint, marginBottom: 7 }}>Win rate</div>
                <div className="at-stat-num" style={{ ...display, fontSize: 22, fontWeight: 700 }}>{winRate}%</div>
                <div style={{ ...mono, fontSize: 10, color: C.faint, marginTop: 3 }}>{wins}/{evaluated.length}</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ ...mono, fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: C.faint, marginBottom: 7 }}>Violations</div>
                <div className="at-stat-num" style={{ ...display, fontSize: 22, fontWeight: 700, color: C.amber }}>{violatedTrades.length}</div>
                <div style={{ ...mono, fontSize: 10, color: C.faint, marginTop: 3 }}>{fmtUSD(violatedLosses)}</div>
              </div>
              <ChevronRight size={16} color={C.faint} className="at-hide-mobile" />
            </div>
          </div>

          {rules.length === 0 && setups.length === 0 && (
            <div className="at-fade-in" style={{
              display: "flex", alignItems: "center", justifyContent: "space-between", gap: 14, flexWrap: "wrap",
              background: C.tealDim, border: `1px solid ${C.tealDim}`, borderRadius: 2, padding: "14px 18px", margin: "0 0 18px",
              position: "relative", zIndex: 1,
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <Sparkles size={16} color={C.teal} />
                <div>
                  <div style={{ ...display, fontWeight: 600, fontSize: 13, color: C.bright, marginBottom: 2 }}>Set up your trading rules and setups</div>
                  <div style={{ ...mono, fontSize: 11, color: C.muted }}>Aftertrade uses these to flag rule breaks and group your trades by strategy.</div>
                </div>
              </div>
              <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
                <button onClick={() => setPage("rules")} style={{
                  background: C.teal, color: C.ink, border: "none", borderRadius: 2, padding: "8px 14px",
                  fontSize: 11.5, fontWeight: 700, cursor: "pointer", ...mono,
                }}>
                  Add a rule
                </button>
                <button onClick={() => setPage("setupLibrary")} style={{
                  background: "none", color: C.teal, border: `1px solid ${C.teal}`, borderRadius: 2, padding: "8px 14px",

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Full-resolution phone screenshots can be several MB as base64, which is likely
// well over any payload limit for an in-artifact API call. Downscale + recompress
// to a reasonable size before sending — the original is kept for on-screen display.
function resizeImageForApi(dataUrl, maxDim = 1400, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// This standalone HTML build calls YOUR OWN backend endpoint for screenshot extraction —
// not Anthropic directly. A browser app can never safely hold a real Anthropic API key,
// so this expects a small backend (e.g. the companion Cloudflare Worker) that holds the
// key server-side and exposes: POST { imageBase64, mediaType } -> { trades: [...] } or { error }.
// Configure the URL in Settings → Trade capture before screenshot import will work.

async function testApiConnection(endpointUrl) {
  if (!endpointUrl) return { ok: false, detail: "No extraction endpoint configured. Set one in Settings → Trade capture." };
  try {
    const response = await fetch(endpointUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ imageBase64: "", mediaType: "image/png", ping: true }),
    });
    let data;
    try { data = await response.json(); } catch (e) {
      return { ok: false, detail: `Response wasn't JSON (status ${response.status}).` };
    }
    if (!response.ok && !data) {
      return { ok: false, detail: `Endpoint returned HTTP ${response.status}.` };
    }
    return { ok: true, detail: `Endpoint reachable (status ${response.status}).` };
  } catch (e) {
    return { ok: false, detail: `${e.name || "Error"}: ${e.message || e}` };
  }
}
