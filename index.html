async function extractTradesFromImage(dataUrl, endpointUrl) {
  const match = dataUrl.match(/^data:(image\/[a-zA-Z+.-]+);base64,(.*)$/);
  if (!match) return { trades: [], error: "Couldn't read this file as an image." };
  const mediaType = match[1];
  const base64Data = match[2];
  const approxKB = Math.round((base64Data.length * 0.75) / 1024);

  if (!endpointUrl) {
    return { trades: [], error: "No extraction endpoint configured. Set one in Settings → Trade capture, or use \"Add a trade I missed\" to enter it by hand." };
  }

  let response;
  try {
    response = await fetch(endpointUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ imageBase64: base64Data, mediaType }),
    });
  } catch (e) {
    return { trades: [], error: `Network error reaching the extraction endpoint (image ~${approxKB}KB): ${e.message || e}` };
  }

  let data;
  try {
    data = await response.json();
  } catch (e) {
    return { trades: [], error: `Bad response from the extraction endpoint (status ${response.status}).` };
  }

  if (!response.ok) {
    return { trades: [], error: `Extraction endpoint error: ${data.error || `HTTP ${response.status}`}` };
  }
  if (data.error) {
    return { trades: [], error: data.error };
  }
  if (!Array.isArray(data.trades)) {
    return { trades: [], error: "Unexpected response format from the extraction endpoint." };
  }
  return { trades: data.trades, error: null };
}

function TradeScreenshotFlow({ setups, onConfirm, onSkip, confirmLabel = "Log these trades", extractionApiUrl }) {
  const [step, setStep] = useState("pick"); // pick | parsing | review
  const [images, setImages] = useState([]); // [{ id, url }]
  const [tradeRows, setTradeRows] = useState([]); // extracted, editable trades, each with imageId
  const [readErrors, setReadErrors] = useState([]); // screenshots that failed to parse
  const fileInputRef = React.useRef(null);

  const normalizeSide = (s) => {
    if (!s) return null;
    const v = String(s).toLowerCase();
    if (v.includes("buy") || v.includes("long")) return "Buy";
    if (v.includes("sell") || v.includes("short")) return "Sell";
    return null;
  };

  const handleFiles = async (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setStep("parsing");
    const newImages = [];
    for (const file of files) {
      const url = await readFileAsDataURL(file);
      newImages.push({ id: `img-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, url });
    }
    setImages(newImages);

    const rows = [];
    const errors = [];
    for (const img of newImages) {
      let apiUrl = img.url;
      try {
        apiUrl = await resizeImageForApi(img.url);
      } catch (e) {
        // if resizing fails for any reason, fall back to the original image
      }
      const { trades, error } = await extractTradesFromImage(apiUrl, extractionApiUrl);
      if (error) errors.push(error);
      trades.forEach(t => {
        let opened = new Date();
        if (t.date) {
          const parsed = new Date(t.time ? `${t.date}T${t.time}` : t.date);
          if (!isNaN(parsed.getTime())) opened = parsed;
        }
        rows.push({
          tempId: `parse-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          pair: t.pair || null,
          side: normalizeSide(t.side),
          pl: typeof t.pl === "number" ? t.pl : null,
          plPct: typeof t.plPct === "number" ? t.plPct : null,
          vol: typeof t.vol === "number" ? t.vol : null,
          heldMin: typeof t.heldMin === "number" ? t.heldMin : null,
          rrPlanned: typeof t.rrPlanned === "number" ? t.rrPlanned : null,
          riskPct: typeof t.riskPct === "number" ? t.riskPct : null,
          opened,
          dateUnread: !t.date,
          session: null,
          setup: null,
          imageId: img.id,
        });
      });
    }
    setReadErrors(errors);
    setTradeRows(rows);
    setStep("review");
  };

  const setRowField = (tempId, k, v) => setTradeRows(prev => prev.map(r => r.tempId === tempId ? { ...r, [k]: v } : r));
  const removeRow = (tempId) => setTradeRows(prev => prev.filter(r => r.tempId !== tempId));
  const addBlankRow = () => setTradeRows(prev => [...prev, { ...blankTradeRow(), imageId: images[0] ? images[0].id : null }]);

  const handleConfirmAll = () => {
    const trades = tradeRows.map((row, i) => {
      const img = images.find(im => im.id === row.imageId);
      const rrPlanned = row.rrPlanned !== null && row.rrPlanned !== "" ? Number(row.rrPlanned) : 0;
      const plPct = row.plPct !== null && row.plPct !== "" ? Number(row.plPct) : 0;
      return {
        id: `up-${Date.now()}-${i}`,
        pair: row.pair || "Unknown",
        side: row.side || "Buy",
        opened: row.opened,
        setup: row.setup || (setups && setups.length ? setups[0].name : MOCK_SETUPS[0]),
        pl: row.pl !== null && row.pl !== "" ? Number(row.pl) : 0,
        plPct,
        vol: row.vol !== null && row.vol !== "" ? Number(row.vol) : 0,
        heldMin: row.heldMin !== null && row.heldMin !== "" ? Number(row.heldMin) : 0,
        rrPlanned,
        riskPct: row.riskPct !== null && row.riskPct !== "" ? Number(row.riskPct) : undefined,
        rMultiple: rrPlanned ? +(plPct / 10).toFixed(2) : 0,
        session: row.session,
        newsWithin15: false,
        minsSincePriorLoss: 9999,
        screenshotUrl: img ? img.url : null,
        source: "screenshot",
      };
    });
    onConfirm(trades);
  };

  if (step === "pick") {
    return (
      <Card style={{ width: "100%", maxWidth: 420, padding: 24, border: `1px solid ${C.hairSoft}`, textAlign: "center" }}>
        <div
          onClick={() => fileInputRef.current && fileInputRef.current.click()}
          onDragOver={(e) => e.preventDefault()}
          onDrop={(e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); }}
          style={{
            border: `1.5px dashed ${C.hair}`, borderRadius: 2, padding: "36px 16px", cursor: "pointer",
            display: "flex", flexDirection: "column", alignItems: "center", gap: 10, marginBottom: 14,
          }}
        >
          <Download size={22} color={C.faint} style={{ transform: "rotate(180deg)" }} />
          <div style={{ ...display, fontWeight: 600, fontSize: 14 }}>Upload trade screenshots</div>
          <div style={{ ...mono, fontSize: 10.5, color: C.faint, textAlign: "center", lineHeight: 1.6 }}>
            Select one or more screenshots — a whole day's trades at once, or trade history covering several days. Tap to choose files, or drag them here.
          </div>
        </div>
        <input ref={fileInputRef} type="file" accept="image/*" multiple style={{ display: "none" }}
          onChange={(e) => handleFiles(e.target.files)} />
        <button onClick={() => { setImages([]); setTradeRows([{ ...blankTradeRow(), imageId: null }]); setReadErrors([]); setStep("review"); }} style={{
          width: "100%", background: "none", border: `1px solid ${C.hair}`, color: C.muted, borderRadius: 2, padding: "10px 16px",
          fontSize: 12.5, fontWeight: 600, cursor: "pointer", marginBottom: onSkip ? 10 : 0, ...mono,
        }}>
          Enter trades manually instead
        </button>
        {onSkip && (
          <button onClick={onSkip} style={{
            width: "100%", background: "none", border: "none", color: C.faint, cursor: "pointer",
            padding: "8px 0", fontSize: 11.5, ...mono,
          }}>
            Skip for now
          </button>
        )}
      </Card>
    );
  }

  if (step === "parsing") {
    return (
      <Card style={{ width: "100%", maxWidth: 420, padding: 24, border: `1px solid ${C.hairSoft}` }}>
        <div className="at-fade-in" style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "20px 10px" }}>
          <ConstructionLoader size={90} />
          <div style={{ ...display, fontWeight: 600, fontSize: 14, color: C.bright, marginTop: 8, marginBottom: 4, textAlign: "center" }}>Reading screenshots…</div>
          <div style={{ ...mono, fontSize: 10.5, color: C.faint, textAlign: "center" }}>Extracting trades — pair, price, size, and P/L</div>
        </div>
      </Card>
    );
  }

  // review — a batch of extracted trades, possibly from multiple screenshots
  return (
    <Card style={{ width: "100%", maxWidth: 460, padding: 20, border: `1px solid ${C.hairSoft}`, maxHeight: "85vh", overflowY: "auto" }}>
      {images.length > 0 && (
        <div style={{ ...mono, fontSize: 10, color: C.amber, marginBottom: 6, display: "flex", alignItems: "center", gap: 5 }}>
          <AlertTriangle size={11} /> Double-check these — anything that couldn't be read is left blank for you to fill in
        </div>
      )}
      <div style={{ ...mono, fontSize: 11, color: C.muted, marginBottom: 14 }}>
        {images.length > 0
          ? <>{tradeRows.length} trade{tradeRows.length !== 1 ? "s" : ""} found across {images.length} screenshot{images.length !== 1 ? "s" : ""}</>
          : <>Entering trades manually</>}
      </div>
      {readErrors.length > 0 && (
        <div style={{
          display: "flex", flexDirection: "column", gap: 6, padding: "10px 12px", marginBottom: 14, borderRadius: 2,
          background: C.red + "15", border: `1px solid ${C.redDim}`,
        }}>
          <div style={{ display: "flex", alignItems: "flex-start", gap: 8 }}>
            <AlertTriangle size={13} color={C.red} style={{ flexShrink: 0, marginTop: 1 }} />
            <div style={{ ...mono, fontSize: 10.5, color: C.red, lineHeight: 1.6 }}>
              {readErrors.length} screenshot{readErrors.length !== 1 ? "s" : ""} couldn't be read automatically. Use "Add a trade I missed" below to enter those by hand.
            </div>
          </div>
          {readErrors.map((err, i) => (
            <div key={i} style={{ ...mono, fontSize: 9.5, color: C.red, opacity: 0.75, paddingLeft: 21 }}>{err}</div>
          ))}
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 14 }}>
        {tradeRows.map((row, idx) => {
          const img = images.find(im => im.id === row.imageId);
          const blankStyle = { ...inputStyle, borderColor: C.amber, background: C.amber + "0f" };
          const fieldStyle = (v) => (v === null || v === "" ? blankStyle : inputStyle);
          return (
            <div key={row.tempId} style={{ border: `1px solid ${C.hairSoft}`, borderRadius: 2, padding: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  {img && <img src={img.url} alt="" style={{ width: 28, height: 28, borderRadius: 2, objectFit: "cover", border: `1px solid ${C.hairSoft}` }} />}
                  <span style={{ ...mono, fontSize: 10.5, color: C.faint }}>Trade {idx + 1}</span>
                </div>
                <button onClick={() => removeRow(row.tempId)} style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", display: "flex" }}>
                  <Trash2 size={14} />
                </button>
              </div>
              <div style={{ marginBottom: 8 }}>
                <div style={{ ...mono, fontSize: 9, textTransform: "uppercase", color: C.faint, marginBottom: 4 }}>Date</div>
                <input
                  type="date"
                  value={dateKey(row.opened)}
                  onChange={(e) => {
                    if (!e.target.value) return;
                    const [y, m, d] = e.target.value.split("-").map(Number);
                    const next = new Date(row.opened);
                    next.setFullYear(y, m - 1, d);
                    setTradeRows(prev => prev.map(r => r.tempId === row.tempId ? { ...r, opened: next, dateUnread: false } : r));
                  }}
                  style={row.dateUnread ? { ...inputStyle, borderColor: C.amber, background: C.amber + "0f" } : inputStyle}
                />
              </div>
              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ ...mono, fontSize: 9, textTransform: "uppercase", color: C.faint, marginBottom: 4 }}>Pair</div>
                  <input type="text" value={row.pair || ""} placeholder="— unreadable —" onChange={(e) => setRowField(row.tempId, "pair", e.target.value)} style={fieldStyle(row.pair)} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ ...mono, fontSize: 9, textTransform: "uppercase", color: C.faint, marginBottom: 4 }}>Side</div>
                  <select value={row.side || ""} onChange={(e) => setRowField(row.tempId, "side", e.target.value)} style={fieldStyle(row.side)}>
                    <option value="">— unreadable —</option>
                    <option>Buy</option><option>Sell</option>
                  </select>
                </div>
              </div>
              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ ...mono, fontSize: 9, textTransform: "uppercase", color: C.faint, marginBottom: 4 }}>P/L ($)</div>
                  <input type="number" value={row.pl === null ? "" : row.pl} placeholder="—" onChange={(e) => setRowField(row.tempId, "pl", e.target.value === "" ? null : e.target.value)} style={fieldStyle(row.pl)} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ ...mono, fontSize: 9, textTransform: "uppercase", color: C.faint, marginBottom: 4 }}>P/L (%)</div>
                  <input type="number" step="0.01" value={row.plPct === null ? "" : row.plPct} placeholder="—" onChange={(e) => setRowField(row.tempId, "plPct", e.target.value === "" ? null : e.target.value)} style={fieldStyle(row.plPct)} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ ...mono, fontSize: 9, textTransform: "uppercase", color: C.faint, marginBottom: 4 }}>Size</div>
                  <input type="number" step="0.01" value={row.vol === null ? "" : row.vol} placeholder="—" onChange={(e) => setRowField(row.tempId, "vol", e.target.value === "" ? null : e.target.value)} style={fieldStyle(row.vol)} />
                </div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ ...mono, fontSize: 9, textTransform: "uppercase", color: C.faint, marginBottom: 4 }}>Held (min)</div>
                  <input type="number" value={row.heldMin === null ? "" : row.heldMin} placeholder="—" onChange={(e) => setRowField(row.tempId, "heldMin", e.target.value === "" ? null : e.target.value)} style={fieldStyle(row.heldMin)} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ ...mono, fontSize: 9, textTransform: "uppercase", color: C.faint, marginBottom: 4 }}>Risk (%)</div>
                  <input type="number" step="0.1" value={row.riskPct === null ? "" : row.riskPct} placeholder="—" onChange={(e) => setRowField(row.tempId, "riskPct", e.target.value === "" ? null : e.target.value)} style={fieldStyle(row.riskPct)} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ ...mono, fontSize: 9, textTransform: "uppercase", color: C.faint, marginBottom: 4 }}>Setup</div>
                  <select value={row.setup || ""} onChange={(e) => setRowField(row.tempId, "setup", e.target.value)} style={fieldStyle(row.setup)}>
                    <option value="">— choose —</option>
                    {(setups && setups.length ? setups.map(s => s.name) : MOCK_SETUPS).map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {tradeRows.length === 0 ? (
        <div style={{ ...mono, fontSize: 11.5, color: C.faint, textAlign: "center", padding: "10px 0 16px" }}>No trades left to log.</div>
      ) : null}

      <button onClick={addBlankRow} style={{
        width: "100%", background: "none", border: `1px dashed ${C.hair}`, color: C.muted, borderRadius: 2, padding: "9px 16px",
        fontSize: 12, cursor: "pointer", marginBottom: 10, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, ...mono,
      }}>
        <Plus size={13} /> Add a trade I missed
      </button>

      <button onClick={handleConfirmAll} disabled={tradeRows.length === 0} style={{
        width: "100%", background: tradeRows.length ? C.teal : C.hairSoft, color: tradeRows.length ? C.ink : C.faint,
        border: "none", borderRadius: 2, padding: "12px 16px", fontSize: 13.5, fontWeight: 700,
        cursor: tradeRows.length ? "pointer" : "default", marginBottom: 8,
      }}>
        {confirmLabel} ({tradeRows.length})
      </button>
      <button onClick={() => { setStep("pick"); setImages([]); setTradeRows([]); }} style={{
        width: "100%", background: "none", border: "none", color: C.faint, cursor: "pointer", padding: "6px 0", fontSize: 11.5, ...mono,
      }}>
        Start over
      </button>
    </Card>
  );
}
const inputStyle = { width: "100%", background: C.ink, border: `1px solid ${C.hair}`, borderRadius: 2, padding: "9px 10px", fontSize: 12.5, color: C.bright, boxSizing: "border-box" };

function OnboardingScreen({ onFinish }) {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [startingBalance, setStartingBalance] = useState("");
  const [stage, setStage] = useState("form"); // form | creating
  const [error, setError] = useState("");

  const handleCreate = () => {
    if (!name.trim() || !email.trim() || !password.trim() || !startingBalance.trim()) {
      setError("All fields are required to create your account.");
      return;
    }
    if (!/^\S+@\S+\.\S+$/.test(email)) {
      setError("Enter a valid email address.");
      return;
    }
    const balanceNum = Number(startingBalance);
    if (!Number.isFinite(balanceNum) || balanceNum < 0) {
      setError("Enter a valid starting balance.");
      return;
    }
    setError("");
    setStage("creating");
    setTimeout(() => { onFinish(balanceNum); }, 900);
  };

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "40px 20px" }}>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 8 }}>
        <img src={APP_ICON_URI} alt="Aftertrade" style={{ width: 56, height: 56, borderRadius: 2, marginBottom: 14 }} />
        <span style={{ ...display, fontWeight: 800, fontSize: 28, letterSpacing: "-0.02em", color: C.bright }}>
          <span style={{ color: C.teal }}>after</span>trade
        </span>
      </div>
      <p style={{ ...mono, fontSize: 12.5, color: C.muted, textAlign: "center", maxWidth: 340, marginTop: 18, marginBottom: 34, lineHeight: 1.6 }}>
        Aftertrade analyzes what you've already traded. Create an account to get started — you'll log trades yourself by uploading a screenshot, no broker connection required.
      </p>

      <Card style={{ width: "100%", maxWidth: 380, padding: 24, border: `1px solid ${C.hairSoft}`, position: "relative", overflow: "hidden" }}>
        {stage === "creating" ? (
          <div className="at-fade-in" style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "20px 10px" }}>
            <ConstructionLoader size={100} />
            <div style={{ ...display, fontWeight: 600, fontSize: 14, color: C.bright, marginTop: 8, marginBottom: 6, textAlign: "center" }}>Creating your account…</div>
          </div>
        ) : (
          <>
            <div style={{ ...display, fontWeight: 600, fontSize: 15, marginBottom: 18 }}>Create your account</div>
            <div style={{ marginBottom: 12 }}>
              <div style={{ ...mono, fontSize: 10, textTransform: "uppercase", color: C.faint, marginBottom: 6 }}>Name</div>
              <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Jane Trader" style={inputStyle} />
            </div>
            <div style={{ marginBottom: 12 }}>
              <div style={{ ...mono, fontSize: 10, textTransform: "uppercase", color: C.faint, marginBottom: 6 }}>Email</div>
              <input value={email} onChange={(e) => setEmail(e.target.value)} type="email" placeholder="you@example.com" style={inputStyle} />
            </div>
            <div style={{ marginBottom: 12 }}>
              <div style={{ ...mono, fontSize: 10, textTransform: "uppercase", color: C.faint, marginBottom: 6 }}>Password</div>
              <input value={password} onChange={(e) => setPassword(e.target.value)} type="password" placeholder="••••••••" style={inputStyle} />
            </div>
            <div style={{ marginBottom: 8 }}>
              <div style={{ ...mono, fontSize: 10, textTransform: "uppercase", color: C.faint, marginBottom: 6 }}>Starting balance / current equity</div>
              <input value={startingBalance} onChange={(e) => setStartingBalance(e.target.value)} type="number" placeholder="10000" style={inputStyle} />
            </div>
            {error && <div style={{ ...mono, fontSize: 11, color: C.red, marginBottom: 12 }}>{error}</div>}
            <button onClick={handleCreate} style={{
              width: "100%", background: C.teal, color: C.ink, border: "none", borderRadius: 2, padding: "12px 16px",
              fontSize: 13.5, fontWeight: 700, cursor: "pointer", marginTop: error ? 0 : 12,
            }}>
              Create account
            </button>
            <div style={{ ...mono, fontSize: 10, color: C.faint, textAlign: "center", marginTop: 12 }}>
              Prototype — any values will create a demo account.
            </div>
          </>
        )}
      </Card>
    </div>
  );
}

function AccountPage({ totalPL, openPL, winRate, wins, evaluated, violatedTrades, violatedLosses, edgeScore, adherencePct, avgR, perf, setPage, balance, equity, todaysPL }) {
  const edgeColor = edgeScore >= 70 ? C.green : edgeScore >= 45 ? C.amber : C.red;
  const streakLabel = perf.streak > 0 ? `${perf.streak} ${perf.streakType === "win" ? "win" : "loss"}${perf.streak !== 1 ? "s" : ""} in a row` : "—";
  const setupRows = Object.entries(perf.bySetup).sort((a, b) => b[1].pl - a[1].pl);
  const pairRows = Object.entries(perf.byPair).sort((a, b) => b[1].pl - a[1].pl);

  return (
    <div>
      <div style={{ ...display, fontSize: 22, fontWeight: 700, marginBottom: 4, color: C.bright }}>Account Overview</div>
      <div style={{ ...mono, fontSize: 12, color: C.muted, marginBottom: 28 }}>Built from your uploaded trade screenshots</div>

      {/* SNAPSHOT */}
      <div style={{ ...mono, fontSize: 10.5, letterSpacing: "0.1em", textTransform: "uppercase", color: C.faint, marginBottom: 14 }}>Snapshot</div>
      <div style={{ display: "flex", gap: 36, flexWrap: "wrap", marginBottom: 30 }}>
        <StatBlock label="Balance" value={fmtMoney(balance)} sub={`${todaysPL >= 0 ? "+" : "−"}${fmtMoney(Math.abs(todaysPL))} today`} />
        <StatBlock label="Edge Score" value={String(edgeScore)} color={edgeColor} sub={edgeScore >= 70 ? "Strong" : edgeScore >= 45 ? "Inconsistent" : "Weak"} />
      </div>

      {/* PERFORMANCE — what a trader actually reviews */}
      <div style={{ ...mono, fontSize: 10.5, letterSpacing: "0.1em", textTransform: "uppercase", color: C.faint, marginBottom: 14, paddingTop: 6, borderTop: `1px solid ${C.hairSoft}` }}>Performance · 30 days</div>
      <div style={{ display: "flex", gap: 36, rowGap: 22, flexWrap: "wrap", marginBottom: 20 }}>
        <StatBlock label="Win rate" value={`${winRate}%`} sub={`${wins}/${evaluated.length} trades`} />
        <StatBlock label="Profit factor" value={perf.profitFactor === Infinity ? "∞" : fmt(perf.profitFactor, 2).replace("+", "")} sub="gross profit ÷ gross loss" />
        <StatBlock label="Expectancy" value={`${fmt(avgR, 2)}R`} color={avgR >= 0 ? C.green : C.red} sub="avg R-multiple per trade" />
        <StatBlock label="Avg win / loss" value={`${fmtUSD(perf.avgWin)} / ${fmtUSD(-perf.avgLoss)}`} sub={`ratio ${perf.avgLoss > 0 ? fmt(perf.avgWin / perf.avgLoss, 2).replace("+", "") : "—"}`} />
        <StatBlock label="Largest win" value={fmtUSD(perf.largestWin)} color={C.green} />
        <StatBlock label="Largest loss" value={fmtUSD(perf.largestLoss)} color={C.red} />
        <StatBlock label="Max drawdown" value={fmtMoney(perf.maxDrawdown)} color={C.red} sub="peak-to-trough decline" />
        <StatBlock label="Current streak" value={streakLabel} color={perf.streakType === "win" ? C.green : perf.streakType === "loss" ? C.red : C.bright} />
      </div>
      <p style={{ fontSize: 13, color: C.muted, lineHeight: 1.6, marginBottom: 30 }}>
        30 days closed at <b style={{ color: totalPL >= 0 ? C.green : C.red }}>{fmtUSD(totalPL)}</b>, a profit factor of{" "}
        <b style={{ color: C.bright }}>{perf.profitFactor === Infinity ? "∞" : fmt(perf.profitFactor, 2).replace("+", "")}</b>.
        {perf.profitFactor < 1.5 && perf.profitFactor > 0 && " Wins are covering losses, but the margin is thin — a small shift in either average win size or loss size moves this meaningfully."}
        {perf.profitFactor >= 1.5 && " That's a healthy cushion between what winners pay and what losers cost."}
      </p>

      {/* DISCIPLINE */}
      <div style={{ ...mono, fontSize: 10.5, letterSpacing: "0.1em", textTransform: "uppercase", color: C.faint, marginBottom: 14, paddingTop: 6, borderTop: `1px solid ${C.hairSoft}` }}>Discipline</div>
      <div style={{ display: "flex", gap: 36, flexWrap: "wrap", marginBottom: 20 }}>
        <StatBlock label="Rule adherence" value={`${adherencePct}%`} color={adherencePct >= 85 ? C.green : C.amber} />
        <StatBlock label="Violations" value={String(violatedTrades.length)} color={C.amber} sub={`${fmtUSD(violatedLosses)} lost`} />
        <StatBlock label="Most broken rule" value={perf.mostBroken ? perf.mostBroken[0] : "None"} sub={perf.mostBroken ? `${perf.mostBroken[1]} occurrences` : ""} />
      </div>

      {/* PATTERNS — costliest recurring behaviors, ranked by dollars lost */}
      {perf.patternRanked.length > 0 && (
        <>
          <div style={{ ...mono, fontSize: 10.5, letterSpacing: "0.1em", textTransform: "uppercase", color: C.faint, marginBottom: 12 }}>Patterns</div>
          <div style={{ border: `1px solid ${C.hairSoft}`, borderRadius: 2, overflow: "hidden", marginBottom: 30 }}>
            {perf.patternRanked.slice(0, 4).map((p, i, arr) => (
              <div key={p.key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "13px 16px", borderBottom: i < arr.length - 1 ? `1px solid ${C.hairSoft}` : "none" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <TrendingDown size={14} color={C.red} />
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 500 }}>{p.key}</div>
                    <div style={{ ...mono, fontSize: 10.5, color: C.faint, marginTop: 2 }}>{p.count} occurrence{p.count !== 1 ? "s" : ""}</div>
                  </div>
                </div>
                <div style={{ ...mono, fontSize: 13.5, fontWeight: 700, color: C.red }}>{fmtUSD(p.cost)}</div>
              </div>
            ))}
          </div>
        </>
      )}

      {/* BY SETUP */}
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 12, paddingTop: 6, borderTop: `1px solid ${C.hairSoft}` }}>
        <div style={{ ...mono, fontSize: 10.5, letterSpacing: "0.1em", textTransform: "uppercase", color: C.faint }}>By Setup</div>
        <button onClick={() => setPage("setupLibrary")} style={{ ...mono, fontSize: 10.5, color: C.teal, background: "none", border: "none", cursor: "pointer" }}>Setup Library →</button>
      </div>
      <div style={{ border: `1px solid ${C.hairSoft}`, borderRadius: 2, overflow: "hidden", marginBottom: 30 }}>
        {setupRows.map(([name, s], i) => (
          <div key={name} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "13px 16px", borderBottom: i < setupRows.length - 1 ? `1px solid ${C.hairSoft}` : "none" }}>
            <div>
              <div style={{ ...display, fontWeight: 600, fontSize: 13.5 }}>{name}</div>
              <div style={{ ...mono, fontSize: 10.5, color: C.faint, marginTop: 2 }}>{s.trades} trades · {Math.round((s.wins / s.trades) * 100)}% win rate</div>
            </div>
            <div style={{ ...mono, fontSize: 14, fontWeight: 700, color: s.pl >= 0 ? C.green : C.red }}>{fmtUSD(s.pl)}</div>
          </div>
        ))}
      </div>

      {/* BY INSTRUMENT */}
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 12, paddingTop: 6, borderTop: `1px solid ${C.hairSoft}` }}>
        <div style={{ ...mono, fontSize: 10.5, letterSpacing: "0.1em", textTransform: "uppercase", color: C.faint }}>By Instrument</div>
        <button onClick={() => setPage("instrumentLibrary")} style={{ ...mono, fontSize: 10.5, color: C.teal, background: "none", border: "none", cursor: "pointer" }}>Instrument Library →</button>
      </div>
      <div style={{ border: `1px solid ${C.hairSoft}`, borderRadius: 2, overflow: "hidden" }}>
        {pairRows.map(([pair, p], i) => (
          <div key={pair} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "13px 16px", borderBottom: i < pairRows.length - 1 ? `1px solid ${C.hairSoft}` : "none" }}>
            <div style={{ ...mono, fontWeight: 600, fontSize: 13.5 }}>{pair}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
              <span style={{ ...mono, fontSize: 11, color: C.faint }}>{p.trades} trades</span>
              <span style={{ ...mono, fontSize: 14, fontWeight: 700, color: p.pl >= 0 ? C.green : C.red }}>{fmtUSD(p.pl)}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AllTradesPage({ evaluated, setups, setPage, onOpenTrade, onUploadTrade }) {
  const [search, setSearch] = useState("");
  const [pairFilter, setPairFilter] = useState("all");
  const [setupFilter, setSetupFilter] = useState("all");
  const [violationsOnly, setViolationsOnly] = useState(false);

  const pairs = useMemo(() => [...new Set(evaluated.map(t => t.pair))].sort(), [evaluated]);

  const filtered = evaluated.filter(t => {
    if (pairFilter !== "all" && t.pair !== pairFilter) return false;
    if (setupFilter !== "all" && t.setup !== setupFilter) return false;
    if (violationsOnly && t.violations.length === 0) return false;
    if (search && !`${t.pair} ${t.setup} ${t.side}`.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const exportCSV = () => {
    const header = ["Date", "Pair", "Side", "Setup", "Volume", "Held (min)", "P/L", "P/L %", "R Multiple", "Violations"];
    const rows = filtered.map(t => [
      t.opened.toISOString(), t.pair, t.side, t.setup, t.vol, t.heldMin,
      t.pl.toFixed(2), t.plPct.toFixed(2), t.rMultiple.toFixed(2), t.violations.join(" | "),
    ]);
    const csv = [header, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "aftertrade-trades.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const selectStyle = { background: C.panel, border: `1px solid ${C.hair}`, borderRadius: 2, padding: "8px 10px", fontSize: 12, color: C.bright };

  return (
    <div>
      <button onClick={() => setPage("summaries")} style={{ ...mono, fontSize: 11.5, color: C.teal, background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 4, marginBottom: 14, padding: 0 }}>
        <ArrowLeft size={13} /> Summaries
      </button>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 4 }}>
        <div style={{ ...display, fontSize: 22, fontWeight: 700, color: C.bright }}>All Trades</div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={onUploadTrade} style={{
            display: "flex", alignItems: "center", gap: 6, background: C.tealDim, border: `1px solid ${C.tealDim}`,
            borderRadius: 2, padding: "8px 14px", color: C.teal, cursor: "pointer", ...mono, fontSize: 11.5, fontWeight: 600,
          }}>
            <Plus size={13} /> Log trade
          </button>
          <button onClick={exportCSV} style={{
            display: "flex", alignItems: "center", gap: 6, background: C.panel, border: `1px solid ${C.hairSoft}`,
            borderRadius: 2, padding: "8px 14px", color: C.teal, cursor: "pointer", ...mono, fontSize: 11.5, fontWeight: 600,
          }}>
            <Download size={13} /> Export CSV
          </button>
        </div>
      </div>
      <div style={{ ...mono, fontSize: 12, color: C.muted, marginBottom: 18 }}>{filtered.length} of {evaluated.length} trades</div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 20 }}>
        <div style={{ position: "relative", flex: "1 1 160px" }}>
          <Search size={13} color={C.faint} style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)" }} />
          <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search pair or setup"
            style={{ ...selectStyle, width: "100%", paddingLeft: 30, boxSizing: "border-box" }} />
        </div>
        <select value={pairFilter} onChange={(e) => setPairFilter(e.target.value)} style={selectStyle}>
          <option value="all">All pairs</option>
          {pairs.map(p => <option key={p} value={p}>{p}</option>)}
        </select>
        <select value={setupFilter} onChange={(e) => setSetupFilter(e.target.value)} style={selectStyle}>
          <option value="all">All setups</option>
          {setups.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
        </select>
        <button onClick={() => setViolationsOnly(v => !v)} style={{
          ...selectStyle, cursor: "pointer", color: violationsOnly ? C.amber : C.muted,
          borderColor: violationsOnly ? C.amber : C.hair,
        }}>
          {violationsOnly ? "✓ " : ""}Violations only
        </button>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {filtered.length === 0 ? (
          <EmptyState title="No trades match these filters" note="Try clearing a filter or searching a different pair." />
        ) : filtered.map(t => <AutopsyCard key={t.id} t={t} onClick={() => onOpenTrade(t.id)} />)}
      </div>
    </div>
  );
}

function SetupDetailPage({ name, evaluated, setPage, onOpenTrade }) {
  const trades = evaluated.filter(t => t.setup === name);
  const chronological = [...trades].reverse();
  const stats = analyzeGroup(trades);
  const edgeScore = computeEdgeScore(trades);
  const edgeColor = edgeScore >= 70 ? C.green : edgeScore >= 45 ? C.amber : C.red;
  const [zoom, setZoom] = useState(1);
  const [granularity, setGranularity] = useState("trade");
  const handleFitAll = () => {
    const approxContainerWidth = (typeof window !== "undefined" ? Math.min(860, window.innerWidth - 80) : 860), axisLabelWidth = 62, marginX = 24;
    const n = aggregateForTape(windowTradesForTape(chronological, granularity), granularity).length;
    if (n <= 1) { setZoom(1); return; }
    const usable = approxContainerWidth - axisLabelWidth - marginX * 2;
    setZoom(Math.max(0.02, Math.min(1.4, usable / ((n - 1) * 68))));
  };
  useEffect(() => { handleFitAll(); }, [granularity]); // eslint-disable-line react-hooks/exhaustive-deps

  if (!trades.length) {
    return (
      <div>
        <button onClick={() => setPage("setupLibrary")} style={{ ...mono, fontSize: 11.5, color: C.teal, background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 4, marginBottom: 14, padding: 0 }}>
          <ArrowLeft size={13} /> Setup Library
        </button>
        <div style={{ ...mono, fontSize: 12.5, color: C.faint }}>No trades found for this setup.</div>
      </div>
    );
  }

  return (
    <div>
      <button onClick={() => setPage("setupLibrary")} style={{ ...mono, fontSize: 11.5, color: C.teal, background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 4, marginBottom: 14, padding: 0 }}>
        <ArrowLeft size={13} /> Setup Library
      </button>
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, marginBottom: 4, flexWrap: "wrap" }}>
        <div style={{ ...display, fontSize: 22, fontWeight: 700, color: C.bright }}>{name}</div>
        <div style={{ textAlign: "right" }}>
          <div style={{ ...mono, fontSize: 9, textTransform: "uppercase", color: C.faint }}>Edge</div>
          <div style={{ ...display, fontSize: 24, fontWeight: 700, color: edgeColor }}>{edgeScore}</div>
        </div>
      </div>
      <div style={{ ...mono, fontSize: 12, color: C.muted, marginBottom: 20 }}>{trades.length} trades · net <span style={{ color: stats.pl >= 0 ? C.green : C.red }}>{fmtUSD(stats.pl)}</span></div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, flexWrap: "wrap", gap: 10 }}>
        <div style={{ ...mono, fontSize: 10.5, letterSpacing: "0.1em", textTransform: "uppercase", color: C.faint }}>The Tape</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <GranularityControls granularity={granularity} setGranularity={setGranularity} />
          <ZoomControls zoom={zoom} setZoom={setZoom} onFit={handleFitAll} />
        </div>
      </div>
      <Card style={{ marginBottom: 20, border: `1px solid ${C.hairSoft}`, position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", pointerEvents: "none", zIndex: 0 }}>
          <span className="at-watermark" style={{ ...display, fontSize: 220, fontWeight: 700, color: edgeColor, opacity: 0.07, lineHeight: 1 }}>{edgeScore}</span>
        </div>
        <div style={{ position: "relative", zIndex: 1 }}>
          <Tape trades={chronological} granularity={granularity} zoom={zoom} onViewTrade={onOpenTrade} />
        </div>
        <div style={{ borderTop: `1px solid ${C.hairSoft}`, position: "relative", zIndex: 1 }}><TapeLegend /></div>
      </Card>

      <div style={{ display: "flex", gap: 32, flexWrap: "wrap", marginBottom: 30 }}>
        <StatBlock label="Win rate" value={`${stats.winRate}%`} />
        <StatBlock label="Avg R-multiple" value={`${fmt(stats.avgR, 2)}R`} color={stats.avgR >= 0 ? C.green : C.red} />

      </div>

      <SectionHead title="All trades in this setup" note={`${trades.length} total`} />
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {trades.map(t => <AutopsyCard key={t.id} t={t} onClick={() => onOpenTrade(t.id)} />)}
      </div>
    </div>
  );
}

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <GranularityControls granularity={granularity} setGranularity={setGranularity} />
          <ZoomControls zoom={zoom} setZoom={setZoom} onFit={handleFitAll} />
        </div>
      </div>
      <Card style={{ marginBottom: 20, border: `1px solid ${C.hairSoft}`, position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", pointerEvents: "none", zIndex: 0 }}>
          <span className="at-watermark" style={{ ...display, fontSize: 220, fontWeight: 700, color: edgeColor, opacity: 0.07, lineHeight: 1 }}>{edgeScore}</span>
        </div>
        <div style={{ position: "relative", zIndex: 1 }}>
          <Tape trades={chronological} granularity={granularity} zoom={zoom} onViewTrade={onOpenTrade} />
        </div>
        <div style={{ borderTop: `1px solid ${C.hairSoft}`, position: "relative", zIndex: 1 }}><TapeLegend /></div>
      </Card>

      <div style={{ display: "flex", gap: 32, flexWrap: "wrap", marginBottom: 30 }}>
        <StatBlock label="Win rate" value={`${stats.winRate}%`} />
        <StatBlock label="Avg R-multiple" value={`${fmt(stats.avgR, 2)}R`} color={stats.avgR >= 0 ? C.green : C.red} />
        <StatBlock label="Violations" value={String(stats.violated.length)} color={C.amber} />
      </div>

      <SectionHead title="All trades in this instrument" note={`${trades.length} total`} />
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {trades.map(t => <AutopsyCard key={t.id} t={t} onClick={() => onOpenTrade(t.id)} />)}
      </div>
    </div>
  );
}

const CALENDAR_MODES = [
  { id: "monthDay", label: "Month" },
  { id: "weekDay", label: "Week" },
  { id: "monthWeek", label: "Month·Week" },
  { id: "quarterMonth", label: "Quarter" },
  { id: "yearMonth", label: "Year" },
];

function JournalCalendarPage({ periodGroups, onOpenPeriod }) {
  const dayMap = useMemo(() => { const m = {}; periodGroups.daily.forEach(g => { m[g.key] = g; }); return m; }, [periodGroups.daily]);
  const weekMap = useMemo(() => { const m = {}; periodGroups.weekly.forEach(g => { m[g.key] = g; }); return m; }, [periodGroups.weekly]);
  const monthMap = useMemo(() => { const m = {}; periodGroups.monthly.forEach(g => { m[g.key] = g; }); return m; }, [periodGroups.monthly]);

  const today = new Date();
  const [mode, setMode] = useState("monthDay");
  const [viewDate, setViewDate] = useState(new Date(today.getFullYear(), today.getMonth(), 1));

  const navStep = (dir) => {
    const d = new Date(viewDate);
    if (mode === "monthDay" || mode === "monthWeek") d.setMonth(d.getMonth() + dir);
    else if (mode === "weekDay") d.setDate(d.getDate() + dir * 7);
    else if (mode === "quarterMonth") d.setMonth(d.getMonth() + dir * 3);
    else if (mode === "yearMonth") d.setFullYear(d.getFullYear() + dir);
    setViewDate(d);
  };

  let cells = [];
  let headerLabel = "";
  let gridCols = 7;
  let showWeekdayHeader = false;

  if (mode === "monthDay") {
    gridCols = 7; showWeekdayHeader = true;
    const year = viewDate.getFullYear(), month = viewDate.getMonth();
    const firstOfMonth = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const startWeekday = (firstOfMonth.getDay() + 6) % 7;
    headerLabel = viewDate.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    for (let i = 0; i < startWeekday; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const cellDate = new Date(year, month, d);
      const key = dateKey(cellDate);
      cells.push({ label: String(d), group: dayMap[key], period: "daily", key, isToday: dateKey(today) === key, isFuture: cellDate > today });
    }
  } else if (mode === "weekDay") {
    gridCols = 7; showWeekdayHeader = true;
    const wkKey = weekKey(viewDate);
    const start = new Date(wkKey);
    headerLabel = `Week of ${dateLabel(start)}`;
    for (let i = 0; i < 7; i++) {
      const cellDate = new Date(start); cellDate.setDate(start.getDate() + i);
      const key = dateKey(cellDate);
      cells.push({ label: cellDate.toLocaleDateString(undefined, { weekday: "short" })[0], group: dayMap[key], period: "daily", key, isToday: dateKey(today) === key, isFuture: cellDate > today });
    }
  } else if (mode === "monthWeek") {
    gridCols = 5;
    const year = viewDate.getFullYear(), month = viewDate.getMonth();
    headerLabel = viewDate.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    const monthStart = new Date(year, month, 1);
    const monthEnd = new Date(year, month + 1, 0);
    const weekKeysInMonth = [];
    const cursor = new Date(monthStart);
    while (cursor <= monthEnd) {
      const wk = weekKey(cursor);
      if (!weekKeysInMonth.includes(wk)) weekKeysInMonth.push(wk);
      cursor.setDate(cursor.getDate() + 1);
    }
    weekKeysInMonth.forEach((wk, idx) => {
      cells.push({ label: `W${idx + 1}`, group: weekMap[wk], period: "weekly", key: wk, isToday: false, isFuture: new Date(wk) > today });
    });
  } else if (mode === "quarterMonth") {
    gridCols = 3;
    const year = viewDate.getFullYear();
    const qIdx = Math.floor(viewDate.getMonth() / 3);
    headerLabel = `Q${qIdx + 1} ${year}`;
    for (let m = 0; m < 3; m++) {
      const cellDate = new Date(year, qIdx * 3 + m, 1);
      const key = monthKey(cellDate);
      cells.push({ label: cellDate.toLocaleDateString(undefined, { month: "short" }), group: monthMap[key], period: "monthly", key, isToday: false, isFuture: cellDate > today });
    }
  } else if (mode === "yearMonth") {
    gridCols = 4;
    const year = viewDate.getFullYear();
    headerLabel = String(year);
    for (let m = 0; m < 12; m++) {
      const cellDate = new Date(year, m, 1);
      const key = monthKey(cellDate);
      cells.push({ label: cellDate.toLocaleDateString(undefined, { month: "short" }), group: monthMap[key], period: "monthly", key, isToday: false, isFuture: cellDate > today });
    }
  }

  const visibleTrades = cells.filter(c => c && c.group).flatMap(c => c.group.trades);
  const periodStats = analyzeGroup(visibleTrades);
  const navBtn = { background: "none", border: `1px solid ${C.hairSoft}`, borderRadius: 2, width: 30, height: 30, color: C.muted, cursor: "pointer", fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center" };

  return (
    <div>
      <div style={{ ...display, fontSize: 22, fontWeight: 700, marginBottom: 4, color: C.bright }}>Journal</div>
      <div style={{ ...mono, fontSize: 12, color: C.muted, marginBottom: 16 }}>tap a cell for its full summary</div>

      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 18 }}>
        {CALENDAR_MODES.map(m => (
          <button key={m.id} onClick={() => { setMode(m.id); setViewDate(new Date(today.getFullYear(), today.getMonth(), 1)); }} style={{
            ...mono, fontSize: 10.5, padding: "6px 12px", borderRadius: 2, cursor: "pointer",
            background: mode === m.id ? C.teal : C.panel, color: mode === m.id ? C.ink : C.muted,
            border: `1px solid ${mode === m.id ? C.teal : C.hair}`, fontWeight: mode === m.id ? 700 : 500,
          }}>{m.label}</button>
        ))}
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
        <button onClick={() => navStep(-1)} style={navBtn}>‹</button>
        <div style={{ ...display, fontWeight: 600, fontSize: 15 }}>{headerLabel}</div>
        <button onClick={() => navStep(1)} style={navBtn}>›</button>
      </div>

      {visibleTrades.length > 0 && (
        <div style={{ display: "flex", gap: 28, marginBottom: 20, flexWrap: "wrap" }}>
          <StatBlock label="Trades" value={String(visibleTrades.length)} />
          <StatBlock label="Net P/L" value={fmtUSD(periodStats.pl)} color={periodStats.pl >= 0 ? C.green : C.red} />
          <StatBlock label="Win rate" value={`${periodStats.winRate}%`} />
        </div>
      )}

      {showWeekdayHeader && (
        <div style={{ display: "grid", gridTemplateColumns: `repeat(${gridCols}, 1fr)`, gap: 6, marginBottom: 6 }}>
          {["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => (
            <div key={d} style={{ ...mono, fontSize: 9.5, textAlign: "center", color: C.faint, textTransform: "uppercase" }}>{d}</div>
          ))}
        </div>
      )}
      <div style={{ display: "grid", gridTemplateColumns: `repeat(${gridCols}, 1fr)`, gap: 6, marginBottom: 20 }}>
        {cells.map((c, i) => {
          if (c === null) return <div key={i} />;
          let bg = "transparent", border = C.hairSoft, textColor = C.faint, cellPL = null, hasViolation = false;
          if (c.group) {
            const stats = analyzeGroup(c.group.trades);
            cellPL = stats.pl;
            hasViolation = stats.violated.length > 0;
            bg = stats.pl >= 0 ? "rgba(34,197,94,0.12)" : "rgba(255,65,54,0.12)";
            border = stats.pl >= 0 ? C.greenDim : C.redDim;
            textColor = C.bright;
          }
          const clickable = !!c.group;
          return (
            <button key={i} disabled={!clickable} onClick={() => clickable && onOpenPeriod(c.period, c.key)} style={{
              aspectRatio: "1", borderRadius: 2, border: `1px solid ${c.isToday ? C.teal : border}`,
              background: bg, cursor: clickable ? "pointer" : "default",
              display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
              gap: 2, padding: 4, opacity: c.isFuture ? 0.35 : 1,
            }}>
              <span style={{ ...mono, fontSize: 11, color: textColor, fontWeight: c.isToday ? 700 : 500 }}>{c.label}</span>
              {c.group && <span style={{ ...mono, fontSize: 9, color: cellPL >= 0 ? C.green : C.red, fontWeight: 600 }}>{fmtUSD(Math.round(cellPL))}</span>}
              {hasViolation && <span style={{ width: 4, height: 4, borderRadius: 99, background: C.amber }} />}
            </button>
          );
        })}
      </div>

      <div style={{ display: "flex", gap: 18, flexWrap: "wrap", ...mono, fontSize: 10.5, color: C.faint }}>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: "rgba(34,197,94,0.2)", border: `1px solid ${C.greenDim}`, display: "inline-block" }} /> Net win</span>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 9, height: 9, borderRadius: 2, background: "rgba(255,65,54,0.2)", border: `1px solid ${C.redDim}`, display: "inline-block" }} /> Net loss</span>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 6, height: 6, borderRadius: 99, background: C.amber, display: "inline-block" }} /> Rule violation</span>
      </div>
    </div>
  );
}

function RulesPage({ rules, persistRules, newRuleType, setNewRuleType, evaluated }) {
  const [customText, setCustomText] = useState("");
  const [interpretation, setInterpretation] = useState(null); // { type, value, summary, matched }
  const [newRuleValue, setNewRuleValue] = useState(RULE_TYPES[newRuleType].default);

  const handleTypeChange = (type) => {
    setNewRuleType(type);
    setNewRuleValue(RULE_TYPES[type].default);
  };

  const handleInterpret = () => {
    if (!customText.trim()) return;
    const result = interpretRuleText(customText);
    setInterpretation({ ...result, matched: result.type !== "custom", rawText: customText.trim() });
  };

  const handleConfirmInterpretation = () => {
    const newRule = interpretation.type === "custom"
      ? { id: `r${Date.now()}`, type: "custom", text: interpretation.rawText, value: null, active: true }
      : { id: `r${Date.now()}`, type: interpretation.type, value: interpretation.value, active: true };
    persistRules([...rules, newRule]);
    setInterpretation(null);
    setCustomText("");
  };


  const ruleStats = rules.map(r => {
    const violated = evaluated.filter(t => t.violatedRuleIds && t.violatedRuleIds.includes(r.id));
    const cost = violated.filter(t => t.pl < 0).reduce((s, t) => s + t.pl, 0);
    return { rule: r, count: violated.length, cost };
  }).sort((a, b) => a.cost - b.cost); // costliest first (most negative)

  return (
    <div>
      <div style={{ ...display, fontSize: 22, fontWeight: 700, marginBottom: 4, color: C.bright }}>Rules Library</div>
      <div style={{ ...mono, fontSize: 12, color: C.muted, marginBottom: 24 }}>how often each rule gets broken — and what it costs when it does</div>

      <SectionHead title="Performance" note={`${rules.length} rules`} />
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 30 }}>
        {ruleStats.length === 0 ? (
          <div style={{ ...mono, fontSize: 12.5, color: C.faint, padding: "10px 0" }}>No rules defined yet.</div>
        ) : ruleStats.map(({ rule, count, cost }) => (
          <Card key={rule.id} style={{ padding: "16px 20px", border: `1px solid ${C.hairSoft}`, opacity: rule.active ? 1 : 0.55 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6, flexWrap: "wrap", gap: 8 }}>
              <span style={{ ...display, fontWeight: 600, fontSize: 14.5 }}>{ruleLabel(rule)}</span>
              <span style={{ ...mono, fontSize: 14, fontWeight: 700, color: cost < 0 ? C.red : C.faint }}>{count > 0 ? fmtUSD(cost) : "—"}</span>
            </div>
            <div style={{ display: "flex", gap: 18 }}>
              <span style={{ ...mono, fontSize: 11.5, color: C.faint }}>{count} violation{count !== 1 ? "s" : ""}</span>
              {!rule.active && <span style={{ ...mono, fontSize: 11.5, color: C.faint }}>inactive</span>}
            </div>
          </Card>
        ))}
      </div>

      {/* MANAGE — define, toggle, edit thresholds; performance above updates automatically */}
      <div style={{ ...mono, fontSize: 10.5, letterSpacing: "0.1em", textTransform: "uppercase", color: C.faint, marginBottom: 12, paddingTop: 6, borderTop: `1px solid ${C.hairSoft}` }}>
        Manage rules
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 24 }}>
        {rules.map(r => (
          <Card key={r.id} style={{ padding: 14, display: "flex", alignItems: "center", gap: 14 }}>
            <button onClick={() => persistRules(rules.map(x => x.id === r.id ? { ...x, active: !x.active } : x))} style={{ background: "none", border: "none", cursor: "pointer", display: "flex" }}>
              {r.active ? <CheckCircle2 size={19} color={C.green} /> : <Circle size={19} color={C.faint} />}
            </button>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13.5, fontWeight: 500, color: r.active ? C.bright : C.faint }}>{ruleLabel(r)}</div>
              {r.type === "custom" ? (
                <div style={{ ...mono, fontSize: 10.5, color: C.faint, marginTop: 2 }}>custom rule · interpreted for rule-break checks</div>
              ) : RULE_TYPES[r.type].unit !== "toggle" && (
                <div style={{ ...mono, fontSize: 11, color: C.muted, marginTop: 2 }}>threshold: {r.value}</div>
              )}
            </div>
            {r.type !== "custom" && RULE_TYPES[r.type].unit !== "toggle" && (
              <input type="number" step="0.1" value={r.value}
                onChange={(e) => persistRules(rules.map(x => x.id === r.id ? { ...x, value: parseFloat(e.target.value) || 0 } : x))}
                style={{ width: 72, background: C.ink, border: `1px solid ${C.hair}`, borderRadius: 2, padding: "6px 8px", fontSize: 13, color: C.bright, ...mono }} />
            )}
            <button onClick={() => persistRules(rules.filter(x => x.id !== r.id))} style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", display: "flex" }}>
              <Trash2 size={16} />
            </button>
          </Card>
        ))}
      </div>

      <Card style={{ padding: 16, border: `1px solid ${C.hairSoft}` }}>
        <div style={{ ...mono, fontSize: 10.5, color: C.faint, marginBottom: 10 }}>Add a rule — every rule needs a value so Aftertrade knows exactly what to check.</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div style={{ flex: "1 1 220px" }}>
            <div style={{ ...mono, fontSize: 9.5, textTransform: "uppercase", color: C.faint, marginBottom: 5 }}>Rule</div>
            <select value={newRuleType} onChange={(e) => handleTypeChange(e.target.value)}
              style={{ width: "100%", background: C.ink, border: `1px solid ${C.hair}`, borderRadius: 2, padding: "9px 12px", fontSize: 13, color: C.bright, boxSizing: "border-box" }}>
              {Object.entries(RULE_TYPES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
          <div style={{ flex: "0 0 120px" }}>
            <div style={{ ...mono, fontSize: 9.5, textTransform: "uppercase", color: C.faint, marginBottom: 5 }}>Value ({RULE_TYPES[newRuleType].unit})</div>
            <input type="number" step="0.1" value={newRuleValue} placeholder={RULE_TYPES[newRuleType].placeholder}
              onChange={(e) => setNewRuleValue(e.target.value)}
              style={{ width: "100%", background: C.ink, border: `1px solid ${C.hair}`, borderRadius: 2, padding: "9px 12px", fontSize: 13, color: C.bright, boxSizing: "border-box", ...mono }} />
          </div>
          <button
            disabled={newRuleValue === "" || newRuleValue === null || Number.isNaN(Number(newRuleValue))}
            onClick={() => {
              persistRules([...rules, { id: `r${Date.now()}`, type: newRuleType, value: Number(newRuleValue), active: true }]);
              setNewRuleValue(RULE_TYPES[newRuleType].default);
            }}
            style={{
              display: "flex", alignItems: "center", gap: 6,
              background: (newRuleValue === "" || newRuleValue === null || Number.isNaN(Number(newRuleValue))) ? C.hairSoft : C.teal,
              color: (newRuleValue === "" || newRuleValue === null || Number.isNaN(Number(newRuleValue))) ? C.faint : C.ink,
              border: "none", borderRadius: 2, padding: "9px 16px", fontSize: 13, fontWeight: 600,
              cursor: (newRuleValue === "" || newRuleValue === null || Number.isNaN(Number(newRuleValue))) ? "default" : "pointer",
            }}>
            <Plus size={15} /> Add rule
          </button>
        </div>
      </Card>

      {/* WRITE YOUR OWN RULE — free text, interpreted into a structured, enforceable rule where possible */}
      <div style={{ ...mono, fontSize: 10.5, letterSpacing: "0.1em", textTransform: "uppercase", color: C.faint, marginBottom: 12, marginTop: 28, paddingTop: 6, borderTop: `1px solid ${C.hairSoft}` }}>
        Write a rule in your own words
      </div>
      <Card style={{ padding: 18, border: `1px solid ${C.hairSoft}` }}>
        {!interpretation ? (
          <>
            <div style={{ ...mono, fontSize: 11.5, color: C.muted, marginBottom: 12, lineHeight: 1.6 }}>
              Describe a rule the way you'd say it to yourself, e.g. "no trades within 20 minutes of a loss" or "never risk more than 2% per trade". Aftertrade will interpret it and check with you before it's used to flag rule breaks.
            </div>
            <textarea value={customText} onChange={(e) => setCustomText(e.target.value)} rows={3} placeholder="e.g. Don't trade the first 15 minutes after a loss"
              style={{ width: "100%", background: C.ink, border: `1px solid ${C.hair}`, borderRadius: 2, padding: "10px 12px", fontSize: 13, color: C.bright, boxSizing: "border-box", resize: "vertical", marginBottom: 12, fontFamily: "inherit" }} />
            <button onClick={handleInterpret} disabled={!customText.trim()} style={{
              display: "flex", alignItems: "center", gap: 6, background: customText.trim() ? C.teal : C.hairSoft,
              color: customText.trim() ? C.ink : C.faint, border: "none", borderRadius: 2, padding: "9px 16px",
              fontSize: 13, fontWeight: 600, cursor: customText.trim() ? "pointer" : "default",
            }}>
              <Sparkles size={14} /> Interpret rule
            </button>
          </>
        ) : (
          <div className="at-fade-in">
            <div style={{ ...mono, fontSize: 10, textTransform: "uppercase", color: C.faint, marginBottom: 8 }}>Your rule</div>
            <div style={{ fontSize: 13, color: C.muted, marginBottom: 16, fontStyle: "italic" }}>"{interpretation.rawText}"</div>
            <div style={{ ...mono, fontSize: 10, textTransform: "uppercase", color: C.faint, marginBottom: 8 }}>Here's what I understood</div>
            <div style={{
              display: "flex", alignItems: "flex-start", gap: 10, padding: "12px 14px", marginBottom: 16, borderRadius: 2,
              background: C.tealDim, border: `1px solid ${C.tealDim}`,
            }}>
              <CheckCircle2 size={16} color={C.teal} style={{ flexShrink: 0, marginTop: 1 }} />
              <div>
                <div style={{ fontSize: 13.5, color: C.bright, marginBottom: 4 }}>{interpretation.summary}</div>
                <div style={{ ...mono, fontSize: 10.5, color: C.faint }}>
                  This maps to a check Aftertrade will automatically apply to every trade. You can fine-tune the value later under Manage rules.
                </div>
              </div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={handleConfirmInterpretation} style={{
                background: C.teal, color: C.ink, border: "none", borderRadius: 2, padding: "9px 16px",
                fontSize: 13, fontWeight: 600, cursor: "pointer",
              }}>
                Yes, that's correct
              </button>
              <button onClick={() => setInterpretation(null)} style={{
                background: "none", color: C.muted, border: `1px solid ${C.hair}`, borderRadius: 2, padding: "9px 16px",
                fontSize: 13, fontWeight: 600, cursor: "pointer",
              }}>
                Let me rephrase
              </button>
            </div>
          </div>
        )}
      </Card>
    </div>
  );
}

const PERIOD_FINER = { weekly: "daily", monthly: "weekly", quarterly: "monthly", annual: "quarterly" };

function periodRange(period, group) {
  const s = period === "daily" ? group.date : group.start;
  let e;
  if (period === "daily") e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 1);
  else if (period === "weekly") e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7);
  else if (period === "monthly") e = new Date(s.getFullYear(), s.getMonth() + 1, 1);
  else if (period === "quarterly") e = new Date(s.getFullYear(), s.getMonth() + 3, 1);
  else e = new Date(s.getFullYear() + 1, 0, 1);
  return [s, e];
}

function hashStringToSeed(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (Math.imul(31, h) + str.charCodeAt(i)) | 0; }
  return h >>> 0;
}

// generates a plausible-looking candle sequence from entry to exit, seeded per-trade so it's stable across renders
function generateMockCandles(trade) {
  const rng = mulberry32(hashStringToSeed(trade.id));
  const n = 16;
  const isWin = trade.pl >= 0;
  const startPrice = 50;
  const endPrice = isWin
    ? (trade.side === "BUY" ? 68 : 32)
    : (trade.side === "BUY" ? 38 : 62);
  const candles = [];
  let price = startPrice;
  for (let i = 0; i < n; i++) {
    const target = startPrice + (endPrice - startPrice) * ((i + 1) / n);
    const drift = (target - price) * 0.5;
    const noise = (rng() - 0.5) * 10;
    const open = price;
    let close = open + drift + noise;
    close = Math.max(5, Math.min(95, close));
    const wickUp = Math.max(open, close) + rng() * 6;
    const wickDown = Math.min(open, close) - rng() * 6;
    candles.push({ open, close, high: Math.min(98, wickUp), low: Math.max(2, wickDown) });
    price = close;
  }
  // force the final close toward the actual exit direction so the last candle reads as the close
  const last = candles[n - 1];
  last.close = endPrice;
  last.high = Math.max(last.open, last.close) + 2;
  last.low = Math.min(last.open, last.close) - 2;
  return candles;
}

function MockCandleChart({ trade }) {
  const candles = useMemo(() => generateMockCandles(trade), [trade.id]);
  const w = 600, h = 220, padding = 16;
  const candleW = (w - padding * 2) / candles.length;
  return (
    <div style={{ position: "relative" }}>
      <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMid meet">
        <line x1={padding} y1={h / 2} x2={w - padding} y2={h / 2} stroke={C.hairSoft} strokeWidth="1" strokeDasharray="2 4" />
        {candles.map((c, i) => {
          const x = padding + i * candleW + candleW / 2;
          const isUp = c.close >= c.open;
          const color = isUp ? C.green : C.red;
          const yScale = (v) => h - padding - (v / 100) * (h - padding * 2);
          const bodyTop = yScale(Math.max(c.open, c.close));
          const bodyBottom = yScale(Math.min(c.open, c.close));
          const isFirst = i === 0, isLast = i === candles.length - 1;
          return (
            <g key={i}>
              <line x1={x} y1={yScale(c.high)} x2={x} y2={yScale(c.low)} stroke={color} strokeWidth="1" opacity="0.8" />
              <rect x={x - candleW * 0.32} y={bodyTop} width={candleW * 0.64} height={Math.max(1.5, bodyBottom - bodyTop)} fill={color} opacity={isFirst || isLast ? 1 : 0.75} />
              {isFirst && <circle cx={x} cy={yScale(c.open)} r="3" fill="none" stroke={C.teal} strokeWidth="1.5" />}
              {isLast && <circle cx={x} cy={yScale(c.close)} r="3" fill={C.teal} />}
            </g>
          );
        })}
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", ...mono, fontSize: 10, color: C.faint, marginTop: 4 }}>
        <span>opening candle</span>
        <span>closing candle</span>
      </div>
    </div>
  );
}

      style={{ display: "flex", overflow: "hidden", cursor: onClick ? "pointer" : "default" }}
    >
      <div style={{ width: 62, flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3, background: isWin ? C.greenDim : C.redDim, borderRight: `1px solid ${C.hair}` }}>
        <span style={{ ...mono, fontWeight: 700, fontSize: 13, color: isWin ? C.green : C.red }}>{fmt(t.plPct)}%</span>
        <span style={{ ...mono, fontSize: 9, textTransform: "uppercase", color: C.muted }}>{isWin ? "win" : "loss"}</span>
      </div>
      <div style={{ flex: 1, padding: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6, flexWrap: "wrap" }}>
          <span style={{ ...display, fontWeight: 600, fontSize: 14, color: C.bright }}>{t.pair} · {t.side}</span>
          <span style={{ ...mono, fontSize: 11, color: C.muted }}>{t.setup} · {t.vol} lots · {dateLabel(t.opened)}</span>
        </div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {t.violations.length === 0 ? (
            <span style={{ ...mono, fontSize: 10.5, padding: "3px 9px", borderRadius: 2, border: `1px solid ${C.greenDim}`, color: C.green }}>No rule violations</span>
          ) : t.violations.map((v, i) => (
            <span key={i} style={{ ...mono, fontSize: 10.5, padding: "3px 9px", borderRadius: 2, border: `1px solid ${C.redDim}`, color: C.red, display: "flex", alignItems: "center", gap: 4 }}>
              <AlertTriangle size={10} /> {v}
            </span>
          ))}
        </div>
      </div>
      <div style={{ width: 110, flexShrink: 0, padding: 16, display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "flex-end", gap: 2, borderLeft: `1px solid ${C.hair}` }}>
        <div style={{ ...mono, fontSize: 9, textTransform: "uppercase", color: C.faint }}>P/L</div>
        <div style={{ ...mono, fontWeight: 700, fontSize: 14, color: isWin ? C.green : C.red }}>{fmtUSD(t.pl)}</div>
        {onClick && <span style={{ ...mono, fontSize: 9.5, color: C.teal, marginTop: 4, display: "flex", alignItems: "center", gap: 2 }}>summary <ChevronRight size={10} /></span>}
      </div>
    </Card>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Ledger />);

</script>

</body>
</html>
